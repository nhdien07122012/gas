<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lưu Clipboard - Quản lý điểm gas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
  /* ========== CSS VARIABLES FOR LIGHT MODE ========== */
  :root {
    --primary: #0f9d58; /* main green */
    --primary-dark: #0b7d45; /* darker for gradients */
    --primary-light: #4cd67f; /* lighter accent */
    --secondary: #34c759; /* success/positive */
    --secondary-dark: #2aa64a;
    --danger: #ff3b30;
    --danger-dark: #e0352b;
    --warning: #ff9500;
    --warning-dark: #e08900;
    --info: #5ac8fa;
    --success: #34c759;
    
    --bg-primary: #ffffff;
    --bg-secondary: #f3f7f2; /* very light greenish background */
    --bg-tertiary: #f7faf7; /* card subtle off-white */
    --bg-card: #ffffff;
    --bg-sidebar: #ffffff;
    --bg-modal: #ffffff;
    --bg-input: #ffffff;
    --bg-hover: #eef7ec;
    --bg-active: #e8f8ea;
    
    --text-primary: #0b3b2a; /* dark green for main text */
    --text-secondary: #576a5f; /* muted green/gray */
    --text-tertiary: #7a9184;
    --text-inverse: #ffffff;
    --text-muted: #adb5bd;
    
    --border-color: #e6efe8;
    --border-light: #eef6ed;
    --border-dark: #cfded0;
    --shadow: 0 2px 10px rgba(0,0,0,0.08);
    --shadow-lg: 0 8px 25px rgba(0,0,0,0.12);
    --shadow-dark: 0 2px 10px rgba(0,0,0,0.15);
    
    --night-shift: #0b7d45;
    --day-shift: #f7fafc;
    
    --radius-xl: 28px;
    --radius-lg: 20px;
    --radius-md: 16px;
    --radius-sm: 12px;
    --radius-xs: 8px;
    --radius-circle: 50%;
    
    --sidebar-width: 280px;
    --header-height: auto;
    
    --transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1),
                  opacity 0.25s ease,
                  background-color 0.25s ease,
                  box-shadow 0.25s ease,
                  color 0.25s ease;
    --transition-fast: transform 0.12s ease, opacity 0.12s ease;
    --transition-slow: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.45s ease;
    
    --font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  }
  
  /* ========== DARK MODE VARIABLES ========== */
  @media (prefers-color-scheme: dark) {
    :root {
      --primary: #23b66a;
      --primary-dark: #0b7d45;
      --primary-light: #4cd67f;
      --secondary: #34c759;
      --secondary-dark: #26a64a;
      --danger: #ff5252;
      --danger-dark: #ff3838;
      --warning: #ffa726;
      --warning-dark: #ff9800;
      --info: #42a5f5;
      --success: #30c75a;

      --bg-primary: #07140e;
      --bg-secondary: #0b1a12;
      --bg-tertiary: #0f231a;
      --bg-card: #0b1410;
      --bg-sidebar: #07140e;
      --bg-modal: #0b1410;
      --bg-input: #0b1410;
      --bg-hover: #082116;
      --bg-active: #12321f;

      --text-primary: #e9f8ee;
      --text-secondary: #a3b8ad;
      --text-tertiary: #7d968a;
      
      --border-color: #122b1f;
      --border-light: #163627;
      --border-dark: #0a2a18;
      --shadow: 0 4px 15px rgba(0,0,0,0.3);
      --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
      --shadow-dark: 0 2px 10px rgba(0,0,0,0.6);
    }
    
    header {
      color: var(--text-inverse) !important;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    }
    header h1, header p {
      color: var(--text-inverse) !important;
    }
    .menu-toggle {
      color: var(--text-inverse) !important;
    }
    .sidebar-header h2 {
      color: var(--text-inverse) !important;
    }
    .close-sidebar {
      color: var(--text-inverse) !important;
    }
    .sidebar-item {
      color: var(--text-primary) !important;
      background: transparent;
    }
    .sidebar-footer p {
      color: rgba(233, 248, 238, 0.9) !important;
    }
  }

  /* ========== CSS RESET & BASE STYLES ========== */
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  
  html {
    font-size: 16px;
    transition: background-color 0.5s ease;
    font-family: var(--font-family);
  }
  
  body {
    font-family: var(--font-family);
    background-color: var(--bg-secondary);
    color: var(--text-primary);
    line-height: 1.6;
    padding: 20px;
    min-height: 100vh;
    transition: var(--transition-slow);
    -webkit-font-smoothing: antialiased;
  }
  
  body.no-scroll {
    overflow: hidden;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    background: var(--bg-card);
    border-radius: var(--radius-xl);
    box-shadow: var(--shadow-lg);
    overflow: hidden;
    transition: var(--transition);
    border: 1px solid var(--border-color);
  }

  /* ========== HEADER STYLES ========== */
  header {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: var(--text-inverse);
    padding: 25px 30px;
    text-align: center;
    position: relative;
    border-radius: var(--radius-xl) var(--radius-xl) 0 0;
  }
  
  header h1 {
    font-size: 1.8rem;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-weight: 600;
  }
  
  header p {
    opacity: 0.9;
    font-size: 1rem;
    font-weight: 400;
  }

  .menu-toggle {
    background: none;
    border: none;
    color: var(--text-inverse);
    font-size: 1.5rem;
    cursor: pointer;
    padding: 5px;
    position: absolute;
    left: 20px;
    top: 50%;
    transform: translateY(-50%);
    transition: var(--transition-fast);
    border-radius: var(--radius-sm);
  }
  
  .menu-toggle:hover {
    background: rgba(255,255,255,0.1);
  }

  /* ========== SIDEBAR STYLES ========== */
  .sidebar {
    position: fixed;
    top: 0;
    left: -280px;
    width: var(--sidebar-width);
    height: 100%;
    background: var(--bg-sidebar);
    box-shadow: 2px 0 15px rgba(0,0,0,0.2);
    z-index: 1001;
    transition: left 0.3s ease;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    border-radius: 0 var(--radius-lg) var(--radius-lg) 0;
    border-right: 1px solid var(--border-color);
  }
  
  .sidebar.open {
    left: 0;
  }
  
  .sidebar-header {
    padding: 20px;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: var(--text-inverse);
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-radius: 0 var(--radius-lg) 0 0;
  }
  
  .sidebar-header h2 {
    font-size: 1.3rem;
    font-weight: 600;
  }
  
  .close-sidebar {
    background: none;
    border: none;
    color: var(--text-inverse);
    font-size: 1.5rem;
    cursor: pointer;
    padding: 0;
    transition: var(--transition-fast);
  }
  
  .close-sidebar:hover {
    transform: scale(1.1);
  }
  
  .sidebar-content {
    padding: 20px;
    flex: 1;
  }
  
  .sidebar-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 15px;
    margin-bottom: 10px;
    border-radius: var(--radius-md);
    background: var(--bg-tertiary);
    color: var(--text-primary);
    cursor: pointer;
    transition: var(--transition);
    border: 1px solid transparent;
    width: 100%;
    text-align: left;
    font-size: 1rem;
    font-weight: 500;
  }

  .sidebar-item:hover {
    background: var(--bg-hover);
    transform: translateY(-2px);
    border-radius: var(--radius-lg);
    border-color: var(--border-light);
    box-shadow: var(--shadow);
  }
  
  .sidebar-item.active {
    background: var(--primary);
    color: var(--text-inverse);
    border-color: var(--primary-dark);
  }
  
  .sidebar-footer {
    padding: 20px;
    border-top: 1px solid var(--border-color);
    font-size: 0.85rem;
    color: var(--text-secondary);
    text-align: center;
  }
  
  .overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
    z-index: 1000;
    display: none;
  }
  
  .overlay.active {
    display: block;
  }

  /* ========== CONTROL PANEL (Bộ lọc & Tìm kiếm) ========== */
  .control-panel {
    padding: 20px 30px;
    background: var(--bg-tertiary);
    border-bottom: 1px solid var(--border-color);
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    align-items: center;
    justify-content: space-between;
  }

  .search-filter-group {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    flex: 1;
  }

  .search-input {
    padding: 10px 16px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border-dark);
    background: var(--bg-input);
    color: var(--text-primary);
    font-size: 0.95rem;
    min-width: 240px;
    flex: 1;
    font-family: var(--font-family);
  }

  .search-input:focus {
    outline: none;
    border-color: var(--primary);
  }

  .filter-select {
    padding: 10px 16px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border-dark);
    background: var(--bg-input);
    color: var(--text-primary);
    font-size: 0.95rem;
    cursor: pointer;
    font-family: var(--font-family);
  }

  .filter-select:focus {
    outline: none;
    border-color: var(--primary);
  }

  .btn {
    padding: 10px 20px;
    border-radius: var(--radius-md);
    border: none;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition-fast);
    font-family: var(--font-family);
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  .btn-danger {
    background: var(--danger);
    color: var(--text-inverse);
  }

  .btn-danger:hover {
    background: var(--danger-dark);
    transform: translateY(-1px);
  }

  .btn-primary {
    background: var(--primary);
    color: var(--text-inverse);
  }

  .btn-primary:hover {
    background: var(--primary-dark);
    transform: translateY(-1px);
  }

  .btn-secondary {
    background: var(--bg-tertiary);
    color: var(--text-primary);
    border: 1px solid var(--border-dark);
  }

  .btn-secondary:hover {
    background: var(--bg-hover);
    transform: translateY(-1px);
  }

  /* ========== HISTORY AREA ========== */
  .history-container {
    padding: 20px 30px;
    min-height: 300px;
  }

  .date-group {
    margin-bottom: 25px;
  }

  .date-header {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 15px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 2px solid var(--border-color);
    padding-bottom: 6px;
  }

  .clipboard-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    padding: 18px 20px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: var(--transition);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .clipboard-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-lg);
    border-color: var(--border-dark);
  }

  .card-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }

  .badge-time-group {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .badge {
    padding: 4px 10px;
    border-radius: var(--radius-sm);
    font-size: 0.75rem;
    font-weight: 700;
  }

  .badge-report {
    background: #fff3cd;
    color: #856404;
    border: 1px solid #ffeeba;
  }
  
  @media (prefers-color-scheme: dark) {
    .badge-report {
      background: #3a2e05;
      color: #ffd54f;
      border: 1px solid #665008;
    }
  }

  .badge-export {
    background: #d4edda;
    color: #155724;
    border: 1px solid #c3e6cb;
  }
  
  @media (prefers-color-scheme: dark) {
    .badge-export {
      background: #0d3817;
      color: #a3e9b3;
      border: 1px solid #165624;
    }
  }

  .badge-other {
    background: #e2e3e5;
    color: #383d41;
    border: 1px solid #d6d8db;
  }
  
  @media (prefers-color-scheme: dark) {
    .badge-other {
      background: #25282a;
      color: #d1d5db;
      border: 1px solid #3c3f41;
    }
  }

  .time-text {
    font-size: 0.85rem;
    color: var(--text-secondary);
    font-weight: 500;
  }

  .card-actions {
    display: flex;
    gap: 8px;
  }

  .btn-icon {
    padding: 6px 12px;
    font-size: 0.85rem;
    border-radius: var(--radius-xs);
  }

  .clipboard-text {
    white-space: pre-wrap;
    background: var(--bg-tertiary);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    padding: 12px;
    font-family: var(--font-family-mono, monospace);
    font-size: 0.9rem;
    color: var(--text-primary);
    max-height: 150px;
    overflow-y: auto;
    word-break: break-all;
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-secondary);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
  }

  .empty-icon {
    font-size: 3.5rem;
    opacity: 0.5;
  }

  /* ========== TOAST NOTIFICATION ========== */
  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: rgba(11, 20, 16, 0.95);
    color: #ffffff;
    padding: 12px 24px;
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-lg);
    z-index: 2000;
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    font-weight: 500;
    font-size: 0.95rem;
    border: 1px solid rgba(255,255,255,0.1);
  }
  
  .toast.show {
    transform: translateX(-50%) translateY(0);
  }
  
  @media (prefers-color-scheme: dark) {
    .toast {
      background: rgba(233, 248, 238, 0.95);
      color: #07140e;
    }
  }

  /* ========== RESPONSIVE STYLES ========== */
  @media (max-width: 768px) {
    body {
      padding: 10px;
    }
    .container {
      border-radius: var(--radius-lg);
    }
    header {
      padding: 20px;
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    }
    header h1 {
      font-size: 1.5rem;
    }
    .control-panel {
      padding: 15px;
    }
    .history-container {
      padding: 15px;
    }
    .search-filter-group {
      width: 100%;
    }
    .search-input, .filter-select {
      width: 100%;
      min-width: unset;
    }
    .btn-clear-all {
      width: 100%;
      justify-content: center;
    }
  }
</style>
</head>
<body>
  <div class="overlay" id="sidebar-overlay"></div>
  
  <div class="toast" id="toast">
    <span id="toast-message">Đã sao chép vào clipboard!</span>
  </div>

  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h2>MenuBar</h2>
      <button class="close-sidebar" id="close-sidebar">&times;</button>
    </div>
    <div class="sidebar-content">
      <button class="sidebar-item" onclick="closeSidebar(); window.location.href='index.html'">
        📋 Quản lý điểm gas
      </button>
      <button class="sidebar-item" onclick="closeSidebar(); window.location.href='diemtien.html'">
        💵 Đếm tiền
      </button>
      <button class="sidebar-item" onclick="closeSidebar(); window.location.href='vitri.html'">
        📍 Quản lý vị trí
      </button>
      <button class="sidebar-item" onclick="closeSidebar(); window.location.href='tinhluong.html'">
        💰 Tính công & lương
      </button>
      <button class="sidebar-item" onclick="closeSidebar(); window.location.href='tinhgascon.html'">
        💧 Tính tiền gas còn lại
      </button>
      <button class="sidebar-item" onclick="closeSidebar(); window.location.href='dudoandiemgas.html'">
        🔮 Dự đoán điểm gas
      </button>
      <button class="sidebar-item active" type="button">
        📋 Lưu Clipboard
      </button>
    </div>
    <div class="sidebar-footer">
      <p>Quản lý điểm gas &copy; 2026</p>
    </div>
  </div>

  <div class="container">
    <header>
      <button class="menu-toggle" id="menu-toggle">彡</button>
      <h1>📋 Lịch sử Lưu Clipboard</h1>
      <p>Lưu trữ và phân loại data đã sao chép </p>
    </header>

    <div class="control-panel">
      <div class="search-filter-group">
        <input type="text" id="search-input" class="search-input" placeholder="Tìm kiếm nội dung sao chép...">
        <select id="filter-type" class="filter-select">
          <option value="all">Tất cả loại dữ liệu</option>
          <option value="report">Báo cáo cuối ca</option>
          <option value="export">Xuất data của ca</option>
          <option value="other">Khác</option>
        </select>
      </div>
      <button id="btn-clear-all" class="btn btn-danger btn-clear-all">
        🗑️ Xóa toàn bộ lịch sử
      </button>
    </div>

    <div class="history-container" id="history-container">
      <!-- Dữ liệu lịch sử render ở đây -->
    </div>
  </div>

  <script>
    // Logic Sidebar
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');
    const menuToggle = document.getElementById('menu-toggle');
    const closeSidebarBtn = document.getElementById('close-sidebar');

    function openSidebar() {
      sidebar.classList.add('open');
      overlay.classList.add('active');
      document.body.classList.add('no-scroll');
    }

    function closeSidebar() {
      sidebar.classList.remove('open');
      overlay.classList.remove('active');
      document.body.classList.remove('no-scroll');
    }

    menuToggle.addEventListener('click', openSidebar);
    closeSidebarBtn.addEventListener('click', closeSidebar);
    overlay.addEventListener('click', closeSidebar);

    // Toast Notification
    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      const toastMessage = document.getElementById('toast-message');
      toastMessage.textContent = message;
      toast.className = `toast ${type} show`;
      setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }

    // Sao chép clipboard
    async function copyToClipboard(text) {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          return true;
        } else {
          const textArea = document.createElement('textarea');
          textArea.value = text;
          textArea.style.position = 'fixed';
          textArea.style.opacity = '0';
          document.body.appendChild(textArea);
          textArea.select();
          const success = document.execCommand('copy');
          document.body.removeChild(textArea);
          return success;
        }
      } catch (err) {
        console.error('Lỗi sao chép clipboard:', err);
        return false;
      }
    }

    // Biến lưu trữ lịch sử
    let clipboardHistory = [];

    // Tải lịch sử từ localStorage
    function loadHistory() {
      try {
        clipboardHistory = JSON.parse(localStorage.getItem('clipboard_history') || '[]');
      } catch (e) {
        console.error('Lỗi tải dữ liệu clipboard_history:', e);
        clipboardHistory = [];
      }
      renderHistory();
    }

    // Badge CSS class tương ứng
    function getBadgeClass(type) {
      if (type === 'Báo cáo cuối ca') return 'badge-report';
      if (type === 'Xuất data của ca') return 'badge-export';
      return 'badge-other';
    }

    // Nhóm lịch sử theo ngày
    function groupHistoryByDate(items) {
      const groups = {};
      const todayStr = new Date().toLocaleDateString('vi-VN');
      
      const yesterday = new Date();
      yesterday.setDate(yesterday.getDate() - 1);
      const yesterdayStr = yesterday.toLocaleDateString('vi-VN');

      items.forEach(item => {
        const itemDate = new Date(item.timestamp);
        const itemDateStr = itemDate.toLocaleDateString('vi-VN');
        
        let groupTitle = `Ngày ${itemDateStr}`;
        if (itemDateStr === todayStr) {
          groupTitle = `Hôm nay - ${itemDateStr}`;
        } else if (itemDateStr === yesterdayStr) {
          groupTitle = `Hôm qua - ${itemDateStr}`;
        }

        if (!groups[groupTitle]) {
          groups[groupTitle] = [];
        }
        groups[groupTitle].push(item);
      });
      return groups;
    }

    // Render danh sách
    function renderHistory() {
      const container = document.getElementById('history-container');
      const searchQuery = document.getElementById('search-input').value.toLowerCase().trim();
      const filterType = document.getElementById('filter-type').value;

      const filteredItems = clipboardHistory.filter(item => {
        const matchesSearch = item.content.toLowerCase().includes(searchQuery);
        let matchesType = true;
        if (filterType === 'report') {
          matchesType = item.type === 'Báo cáo cuối ca';
        } else if (filterType === 'export') {
          matchesType = item.type === 'Xuất data của ca';
        } else if (filterType === 'other') {
          matchesType = item.type === 'Khác';
        }
        return matchesSearch && matchesType;
      });

      if (filteredItems.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">📂</div>
            <p>Không tìm thấy lịch sử clipboard nào phù hợp.</p>
          </div>
        `;
        return;
      }

      const grouped = groupHistoryByDate(filteredItems);
      let html = '';

      Object.keys(grouped).forEach(dateTitle => {
        html += `
          <div class="date-group">
            <div class="date-header">
              📅 ${dateTitle}
            </div>
        `;

        grouped[dateTitle].forEach(item => {
          const itemDate = new Date(item.timestamp);
          const timeStr = itemDate.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
          const escapedContent = escapeHTML(item.content);
          
          html += `
            <div class="clipboard-card">
              <div class="card-meta">
                <div class="badge-time-group">
                  <span class="badge ${getBadgeClass(item.type)}">${item.type}</span>
                  <span class="time-text">🕒 ${timeStr}</span>
                </div>
                <div class="card-actions">
                  <button class="btn btn-primary btn-icon" onclick="copyItemContent(this, '${item.timestamp}')">
                    📋 Sao chép lại
                  </button>
                  <button class="btn btn-danger btn-icon" onclick="deleteItem('${item.timestamp}')">
                    🗑️ Xóa
                  </button>
                </div>
              </div>
              <pre class="clipboard-text">${escapedContent}</pre>
            </div>
          `;
        });

        html += `</div>`; // Close date-group
      });

      container.innerHTML = html;
    }

    // Escape ký tự HTML để an toàn chống XSS
    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          "'": '&#39;',
          '"': '&quot;'
        }[tag] || tag)
      );
    }

    // Thực hiện sao chép lại
    window.copyItemContent = async function(btn, timestamp) {
      const item = clipboardHistory.find(i => i.timestamp === timestamp);
      if (item) {
        const success = await copyToClipboard(item.content);
        if (success) {
          showToast('✅ Đã sao chép lại nội dung vào clipboard!');
          updateTimestampAndMoveToTop(item);
        } else {
          showToast('❌ Sao chép thất bại', 'error');
        }
      }
    };

    // Đẩy lịch sử đã dùng lại lên đầu
    function updateTimestampAndMoveToTop(item) {
      const index = clipboardHistory.indexOf(item);
      if (index > -1) {
        clipboardHistory.splice(index, 1);
      }
      item.timestamp = new Date().toISOString();
      clipboardHistory.unshift(item);
      localStorage.setItem('clipboard_history', JSON.stringify(clipboardHistory));
      renderHistory();
    }

    // Xóa một dòng lịch sử
    window.deleteItem = function(timestamp) {
      if (confirm('Bạn có chắc chắn muốn xóa dòng lịch sử này không?')) {
        clipboardHistory = clipboardHistory.filter(i => i.timestamp !== timestamp);
        localStorage.setItem('clipboard_history', JSON.stringify(clipboardHistory));
        renderHistory();
        showToast('🗑️ Đã xóa mục khỏi lịch sử');
      }
    };

    // Xóa toàn bộ lịch sử
    document.getElementById('btn-clear-all').addEventListener('click', () => {
      if (clipboardHistory.length === 0) {
        showToast('⚠️ Không có dữ liệu lịch sử nào để xóa', 'error');
        return;
      }
      if (confirm('⚠️ Bạn có chắc chắn muốn xóa TOÀN BỘ lịch sử clipboard không? Hành động này không thể hoàn tác!')) {
        clipboardHistory = [];
        localStorage.removeItem('clipboard_history');
        renderHistory();
        showToast('🗑️ Đã xóa sạch toàn bộ lịch sử clipboard');
      }
    });

    // Sự kiện tìm kiếm và bộ lọc loại dữ liệu
    document.getElementById('search-input').addEventListener('input', renderHistory);
    document.getElementById('filter-type').addEventListener('change', renderHistory);

    // Khởi tạo ban đầu
    window.addEventListener('load', loadHistory);
  </script>
</body>
</html>
