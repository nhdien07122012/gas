<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lưu Clipboard - Quản lý điểm gas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
  /* ========== VNPOST DESIGN SYSTEM ========== */
  :root {
    --vnpost-blue: #005ba6;
    --vnpost-blue-dark: #00457c;
    --vnpost-blue-light: rgba(0, 91, 166, 0.08);
    --vnpost-gold: #f59e0b;
    --vnpost-gold-dark: #d97706;
    --vnpost-gold-light: rgba(245, 158, 11, 0.12);

    --primary: var(--vnpost-blue);
    --primary-dark: var(--vnpost-blue-dark);
    --primary-light: var(--vnpost-blue-light);

    --color-success: #10b981;
    --color-success-light: rgba(16, 185, 129, 0.12);
    --color-warning: #f59e0b;
    --color-warning-light: rgba(245, 158, 11, 0.12);
    --color-danger: #ef4444;
    --color-danger-light: rgba(239, 68, 68, 0.12);
    --color-info: #0284c7;

    --bg-page: #f8fafc;
    --bg-card: #ffffff;
    --bg-secondary: #f1f5f9;
    --bg-tertiary: #e2e8f0;
    --bg-sidebar: #ffffff;
    --bg-input: #ffffff;
    --bg-hover: #f1f5f9;

    --border-card: #e2e8f0;
    --border-light: #f1f5f9;
    --border-dark: #cbd5e1;

    --text-main: #0f172a;
    --text-primary: #0f172a;
    --text-secondary: #475569;
    --text-muted: #64748b;
    --text-tertiary: #94a3b8;
    --text-inverse: #ffffff;

    --font-family: 'Be Vietnam Pro', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;

    --radius-xs: 6px;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-xl: 20px;

    --shadow-sm: 0 1px 2px 0 rgba(15, 23, 42, 0.05);
    --shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.07), 0 2px 4px -2px rgba(15, 23, 42, 0.05);
    --shadow-md: 0 10px 15px -3px rgba(15, 23, 42, 0.08), 0 4px 6px -4px rgba(15, 23, 42, 0.04);
    --shadow-lg: 0 20px 25px -5px rgba(15, 23, 42, 0.08);

    --transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    --sidebar-width: 310px;
  }

  html[data-theme="dark"] {
    color-scheme: dark;
    --bg-page: #0b0f19;
    --bg-card: #131b2e;
    --bg-secondary: #1a243b;
    --bg-tertiary: #22304d;
    --bg-sidebar: #131b2e;
    --bg-input: #1a243b;
    --bg-hover: #22304d;

    --border-card: #1e293b;
    --border-light: #1a243b;
    --border-dark: #334155;

    --text-main: #f8fafc;
    --text-primary: #f8fafc;
    --text-secondary: #cbd5e1;
    --text-muted: #94a3b8;
    --text-tertiary: #64748b;

    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
    --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
    --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg-page: #0b0f19;
      --bg-card: #131b2e;
      --bg-secondary: #1a243b;
      --bg-tertiary: #22304d;
      --bg-sidebar: #131b2e;
      --bg-input: #1a243b;
      --bg-hover: #22304d;

      --border-card: #1e293b;
      --border-light: #1a243b;
      --border-dark: #334155;

      --text-main: #f8fafc;
      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --text-tertiary: #64748b;
    }
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-family);
    background-color: var(--bg-page);
    color: var(--text-main);
    line-height: 1.5;
    padding: 16px;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }
  body.no-scroll { overflow: hidden; }

  .container {
    max-width: 680px;
    margin: 0 auto;
    background: var(--bg-card);
    border-radius: var(--radius-xl);
    border: 1px solid var(--border-card);
    box-shadow: var(--shadow-md);
    overflow: hidden;
  }

  /* Heroicons */
  .hero-icon {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    display: inline-block;
    vertical-align: middle;
    color: currentColor;
  }
  .hero-icon-sm { width: 16px; height: 16px; }

  /* App Header (Centered Title) */
  .app-header {
    background: linear-gradient(135deg, var(--vnpost-blue) 0%, #00457c 100%);
    color: white;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    text-align: center;
  }

  .menu-toggle {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255, 255, 255, 0.15);
    border: 1px solid rgba(255, 255, 255, 0.25);
    color: white;
    width: 40px;
    height: 40px;
    border-radius: 10px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: var(--transition);
    flex-shrink: 0;
    z-index: 2;
  }
  .menu-toggle .hero-icon {
    width: 22px;
    height: 22px;
  }
  .menu-toggle:hover {
    background: rgba(255, 255, 255, 0.28);
    transform: translateY(-50%) scale(1.04);
  }

  .header-brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    width: 100%;
    padding: 0 44px;
    min-width: 0;
  }
  .header-text {
    flex: 1;
    min-width: 0;
  }
  .header-title-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .header-title-row h1, .header-title {
    font-size: 20.5px;
    font-weight: 700;
    margin: 0;
    line-height: 1.25;
    letter-spacing: -0.015em;
  }
  .header-subtitle {
    font-size: 14.5px;
    color: rgba(255, 255, 255, 0.9);
    font-weight: 500;
    margin-top: 3px;
    line-height: 1.35;
  }

  /* Control Panel */
  .control-panel {
    padding: 16px 20px;
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border-card);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .search-filter-group {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .search-input {
    flex: 1;
    min-width: 180px;
    padding: 10px 14px;
    border: 1px solid var(--border-card);
    background: var(--bg-card);
    color: var(--text-main);
    border-radius: var(--radius-sm);
    font-size: 15px;
    font-family: inherit;
    outline: none;
    transition: var(--transition);
  }
  .search-input:focus {
    border-color: var(--vnpost-blue);
    box-shadow: 0 0 0 3px var(--vnpost-blue-light);
  }
  .filter-select {
    padding: 10px 14px;
    border: 1px solid var(--border-card);
    background: var(--bg-card);
    color: var(--text-main);
    border-radius: var(--radius-sm);
    font-size: 15px;
    font-family: inherit;
    font-weight: 500;
    outline: none;
    transition: var(--transition);
  }
  .filter-select:focus {
    border-color: var(--vnpost-blue);
    box-shadow: 0 0 0 3px var(--vnpost-blue-light);
  }

  .btn-clear-all {
    align-self: flex-end;
    padding: 9px 16px;
    font-size: 14px;
    font-weight: 600;
    border-radius: var(--radius-sm);
    background: var(--color-danger-light);
    color: var(--color-danger);
    border: 1px solid rgba(239, 68, 68, 0.3);
    cursor: pointer;
    transition: var(--transition);
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn-clear-all:hover {
    background: var(--color-danger);
    color: white;
  }
  .btn-clear-all .hero-icon {
    width: 17px;
    height: 17px;
  }

  /* History Container */
  .history-container {
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .date-group {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .date-header {
    font-size: 13.5px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    display: flex;
    align-items: center;
    gap: 6px;
    padding-bottom: 6px;
    border-bottom: 1px dashed var(--border-card);
  }
  .date-header .hero-icon {
    width: 16px;
    height: 16px;
  }

  .clipboard-card {
    background: var(--bg-card);
    border: 1px solid var(--border-card);
    border-radius: var(--radius-md);
    padding: 16px;
    box-shadow: var(--shadow-sm);
    transition: var(--transition);
  }
  .clipboard-card:hover {
    border-color: var(--vnpost-blue);
    box-shadow: var(--shadow);
  }

  .card-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .badge-time-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .badge {
    font-size: 12.5px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 9999px;
    display: inline-flex;
    align-items: center;
  }
  .badge-report {
    background: var(--vnpost-gold-light);
    color: #92400e;
  }
  .badge-export {
    background: var(--color-success-light);
    color: #047857;
  }
  .badge-other {
    background: var(--bg-secondary);
    color: var(--text-secondary);
  }
  .time-text {
    font-size: 13px;
    color: var(--text-muted);
    font-weight: 500;
  }

  .card-actions {
    display: flex;
    gap: 8px;
  }
  .btn-icon {
    padding: 7px 12px;
    font-size: 13.5px;
    font-weight: 600;
    border-radius: var(--radius-xs);
    border: none;
    cursor: pointer;
    transition: var(--transition-fast);
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .btn-icon .hero-icon {
    width: 16px;
    height: 16px;
  }
  .btn-primary.btn-icon {
    background: var(--vnpost-blue-light);
    color: var(--vnpost-blue);
  }
  .btn-primary.btn-icon:hover {
    background: var(--vnpost-blue);
    color: white;
  }
  .btn-danger.btn-icon {
    background: var(--color-danger-light);
    color: var(--color-danger);
  }
  .btn-danger.btn-icon:hover {
    background: var(--color-danger);
    color: white;
  }

  .clipboard-text {
    font-family: var(--font-mono);
    font-size: 14px;
    background: var(--bg-secondary);
    border: 1px solid var(--border-card);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    color: var(--text-main);
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 220px;
    overflow-y: auto;
    line-height: 1.5;
  }

  /* Empty State */
  .empty-state {
    text-align: center;
    padding: 48px 20px;
    color: var(--text-muted);
    font-size: 15px;
    font-weight: 500;
  }
  .empty-icon {
    font-size: 36px;
    margin-bottom: 12px;
    opacity: 0.6;
  }

  /* Sidebar */
  .sidebar {
    position: fixed;
    top: 0;
    left: -330px;
    width: var(--sidebar-width, 310px);
    max-width: 85vw;
    height: 100%;
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border-card);
    box-shadow: 4px 0 20px rgba(0, 0, 0, 0.15);
    z-index: 1100;
    transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), left 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    display: flex;
    flex-direction: column;
    touch-action: pan-y;
  }
  .sidebar.open {
    left: 0;
    transform: translateX(0);
  }

  .sidebar-header {
    background: linear-gradient(135deg, var(--vnpost-blue) 0%, #00457c 100%);
    color: white;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .sidebar-header h2 {
    font-size: 19px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.2px;
  }
  .close-sidebar {
    background: rgba(255, 255, 255, 0.15);
    border: none;
    color: white;
    width: 32px;
    height: 32px;
    border-radius: 8px;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: var(--transition-fast);
  }
  .close-sidebar:hover { background: rgba(255, 255, 255, 0.3); }

  .sidebar-content {
    flex: 1;
    overflow-y: auto;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .sidebar-item {
    width: 100%;
    padding: 12px 16px;
    border: none;
    background: transparent;
    color: var(--text-main);
    border-radius: var(--radius-sm);
    font-size: 16.5px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    transition: var(--transition-fast);
    text-align: left;
    text-decoration: none;
  }
  .sidebar-item:hover {
    background: var(--bg-hover);
    color: var(--vnpost-blue);
  }
  .sidebar-item.active {
    background: var(--vnpost-blue-light);
    color: var(--vnpost-blue);
    font-weight: 700;
  }
  .sidebar-item .hero-icon {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    color: var(--text-muted);
  }
  .sidebar-item:hover .hero-icon,
  .sidebar-item.active .hero-icon {
    color: var(--vnpost-blue);
  }

  .sidebar-footer {
    padding: 16px 20px;
    border-top: 1px solid var(--border-card);
    font-size: 13.5px;
    font-weight: 500;
    color: var(--text-muted);
    text-align: center;
  }

  .overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(15, 23, 42, 0.45);
    backdrop-filter: blur(4px);
    z-index: 1050;
    display: none;
    opacity: 0;
    transition: opacity 0.22s ease;
  }
  .overlay.active {
    display: block;
    opacity: 1;
  }

  /* Floating Pill Toast */
  .toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-40px);
    background: rgba(15, 23, 42, 0.95);
    backdrop-filter: blur(8px);
    color: #ffffff;
    padding: 10px 18px;
    border-radius: 9999px;
    font-size: 14px;
    font-weight: 500;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.35);
    display: flex;
    align-items: center;
    gap: 8px;
    z-index: 2000;
    opacity: 0;
    visibility: hidden;
    transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    pointer-events: none;
  }
  .toast.show {
    opacity: 1;
    visibility: visible;
    transform: translateX(-50%) translateY(0);
  }
  .toast.success {
    background: #064e3b;
    color: #ecfdf5;
    border: 1px solid #059669;
  }
  .toast.error {
    background: #7f1d1d;
    color: #fef2f2;
    border: 1px solid #dc2626;
  }

  @media (max-width: 480px) {
    body { padding: 8px; }
    .container { border-radius: var(--radius-lg); }
    .app-header { padding: 14px 16px; }
    .control-panel { padding: 14px 14px; }
    .history-container { padding: 14px 14px; }
    .search-filter-group { flex-direction: column; }
    .filter-select { width: 100%; }
    .card-meta { flex-direction: column; align-items: flex-start; }
    .card-actions { width: 100%; justify-content: flex-end; }
  }
</style>
<script>
  (() => {
    const savedTheme = localStorage.getItem('gas_theme');
    if (savedTheme === 'dark' || savedTheme === 'light') {
      document.documentElement.setAttribute('data-theme', savedTheme);
    }
  })();
</script>
</head>
<body>
  <div class="overlay" id="sidebar-overlay"></div>
  
  <div class="toast" id="toast">
    <span id="toast-message">Đã sao chép vào clipboard!</span>
  </div>

  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h2>Danh mục quản lý</h2>
      <button class="close-sidebar" id="close-sidebar" aria-label="Đóng">&times;</button>
    </div>
    <div class="sidebar-content">
      <button class="sidebar-item" onclick="closeSidebar(); window.location.href='index.html'">
        <svg class="hero-icon" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9.293 2.293a1 1 0 011.414 0l7 7A1 1 0 0117 11h-1v6a1 1 0 01-1 1h-2a1 1 0 01-1-1v-3a1 1 0 00-1-1H9a1 1 0 00-1 1v3a1 1 0 01-1 1H5a1 1 0 01-1-1v-6H3a1 1 0 01-.707-1.707l7-7z" clip-rule="evenodd" /></svg>
        Quản lý điểm gas
      </button>
      <button class="sidebar-item" onclick="closeSidebar(); window.location.href='diemtien.html'">
        <svg class="hero-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 7.5a2.25 2.25 0 1 0 0 4.5 2.25 2.25 0 0 0 0-4.5Z" />
          <path fill-rule="evenodd" d="M1.5 4.875C1.5 3.839 2.34 3 3.375 3h17.25c1.035 0 1.875.839 1.875 1.875v9.75c0 1.036-.84 1.875-1.875 1.875H3.375A1.875 1.875 0 0 1 1.5 14.625v-9.75ZM8.25 9.75a3.75 3.75 0 1 1 7.5 0 3.75 3.75 0 0 1-7.5 0ZM18.75 9a.75.75 0 0 0-.75.75v.008c0 .414.336.75.75.75h.008a.75.75 0 0 0 .75-.75V9.75a.75.75 0 0 0-.75-.75h-.008ZM4.5 9.75A.75.75 0 0 1 5.25 9h.008a.75.75 0 0 1 .75.75v.008a.75.75 0 0 1-.75.75H5.25a.75.75 0 0 1-.75-.75V9.75Z" clip-rule="evenodd" />
        </svg>
        Đếm tiền
      </button>
      <button class="sidebar-item" onclick="closeSidebar(); window.location.href='vitri.html'">
        <svg class="hero-icon" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="m9.69 18.933.003.001C9.89 19.02 10 19.02 10.11 18.934l.004-.002.01-.005a20.086 20.086 0 001.838-1.295A21.36 21.36 0 0015.5 12.87c1.336-1.614 2-3.435 2-5.37a7.5 7.5 0 10-15 0c0 1.935.664 3.756 2 5.37a21.36 21.36 0 003.548 4.762 20.086 20.086 0 001.838 1.295l.01.005.004.002.001.001ZM10 10.5a3 3 0 100-6 3 3 0 000 6Z" clip-rule="evenodd" /></svg>
        Quản lý vị trí
      </button>
      <button class="sidebar-item" onclick="closeSidebar(); window.location.href='tinhluong.html'">
        <svg class="hero-icon" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M6 2a2 2 0 00-2 2v12a2 2 0 002 2h8a2 2 0 002-2V4a2 2 0 00-2-2H6zm1 2a1 1 0 000 2h6a1 1 0 100-2H7zm6 7a1 1 0 011 1v3a1 1 0 11-2 0v-3a1 1 0 011-1zm-3 3a1 1 0 100 2h.01a1 1 0 100-2H10zm-4 1a1 1 0 011-1h.01a1 1 0 110 2H7a1 1 0 01-1-1zm1-4a1 1 0 100 2h.01a1 1 0 100-2H7zm3 0a1 1 0 100 2h.01a1 1 0 100-2H10zm3 0a1 1 0 100 2h.01a1 1 0 100-2H13z" clip-rule="evenodd" /></svg>
        Tính công & lương
      </button>
      <button class="sidebar-item" onclick="closeSidebar(); window.location.href='tinhgascon.html'">
        <svg class="hero-icon" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 2a4 4 0 00-4 4v1H5a1 1 0 00-.994.89l-1 9A1 1 0 004 18h12a1 1 0 00.994-1.11l-1-9A1 1 0 0015 7h-1V6a4 4 0 00-4-4zm2 5V6a2 2 0 10-4 0v1h4zm-2 4a2 2 0 100 4 2 2 0 000-4z" clip-rule="evenodd" /></svg>
        Tính tiền gas còn lại
      </button>
      <button class="sidebar-item" onclick="closeSidebar(); window.location.href='dudoandiemgas.html'">
        <svg class="hero-icon" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M12.577 4.878a.75.75 0 01.919-.53l4.5 1.5a.75.75 0 01.504.707v4.5a.75.75 0 01-1.5 0V7.81l-4.22 4.22a.75.75 0 01-1.06 0L8.5 8.81l-5.72 5.72a.75.75 0 01-1.06-1.06l6.25-6.25a.75.75 0 011.06 0l3.22 3.22 3.44-3.44h-3.253a.75.75 0 01-.75-.75v-.382z" clip-rule="evenodd" /></svg>
        Dự đoán điểm gas
      </button>
      <button class="sidebar-item active" type="button">
        <svg class="hero-icon" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M15.988 3.012A2.25 2.25 0 0118 5.25v6.5A2.25 2.25 0 0115.75 14H13.5v-1.5h2.25a.75.75 0 00.75-.75v-6.5a.75.75 0 00-.75-.75h-7.5a.75.75 0 00-.75.75V7H6v-.75A2.25 2.25 0 018.25 3h7.738z" clip-rule="evenodd" /><path fill-rule="evenodd" d="M2 9.25A2.25 2.25 0 014.25 7h7.5A2.25 2.25 0 0114 9.25v7.5A2.25 2.25 0 0111.75 19h-7.5A2.25 2.25 0 012 16.75v-7.5zm2.25-.75a.75.75 0 00-.75.75v7.5c0 .414.336.75.75.75h7.5a.75.75 0 00.75-.75v-7.5a.75.75 0 00-.75-.75h-7.5z" clip-rule="evenodd" /></svg>
        Lưu Clipboard
      </button>
    </div>
    <div class="sidebar-footer">
      <p>Quản lý điểm gas &copy; 2026</p>
    </div>
  </div>

  <div class="container">
    <header class="app-header">
      <button class="menu-toggle" id="menu-toggle" aria-label="Mở Menu">
        <svg class="hero-icon" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M2 4.75A.75.75 0 012.75 4h14.5a.75.75 0 010 1.5H2.75A.75.75 0 012 4.75zM2 10a.75.75 0 01.75-.75h14.5a.75.75 0 010 1.5H2.75A.75.75 0 012 10zm0 5.25a.75.75 0 01.75-.75h14.5a.75.75 0 010 1.5H2.75a.75.75 0 01-.75-.75z" clip-rule="evenodd" /></svg>
      </button>
      <div class="header-brand">
        <div class="header-text">
          <div class="header-title-row">
            <h1>Lịch sử Clipboard</h1>
          </div>
          <p class="header-subtitle">Lưu trữ data</p>
        </div>
      </div>
    </header>

    <div class="control-panel">
      <div class="search-filter-group">
        <input type="text" id="search-input" class="search-input" placeholder="Tìm kiếm nội dung sao chép...">
        <select id="filter-type" class="filter-select">
          <option value="all">Tất cả loại dữ liệu</option>
          <option value="report">Báo cáo cuối ca</option>
          <option value="export">Xuất data của ca</option>
          <option value="other">Khác</option>
        </select>
      </div>
      <button id="btn-clear-all" class="btn-clear-all">
        <svg class="hero-icon hero-icon-sm" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M8.75 1A2.75 2.75 0 006 3.75v.443c-.795.077-1.584.176-2.365.298a.75.75 0 10.23 1.482l.149-.022.841 10.518A2.75 2.75 0 007.596 19h4.807a2.75 2.75 0 002.742-2.53l.841-10.52.149.023a.75.75 0 00.23-1.482A41.03 41.03 0 0014 4.193V3.75A2.75 2.75 0 0011.25 1h-2.5zM10 4c.84 0 1.673.025 2.5.075V3.75c0-.69-.56-1.25-1.25-1.25h-2.5c-.69 0-1.25.56-1.25 1.25v.325C8.327 4.025 9.16 4 10 4zM8.58 7.72a.75.75 0 00-1.5.06l.3 7.5a.75.75 0 101.5-.06l-.3-7.5zm4.34.06a.75.75 0 10-1.5-.06l-.3 7.5a.75.75 0 101.5.06l.3-7.5z" clip-rule="evenodd" /></svg>
        Xóa toàn bộ lịch sử
      </button>
    </div>

    <div class="history-container" id="history-container">
      <!-- Dữ liệu lịch sử render ở đây -->
    </div>
  </div>

  <script>
    // Logic Sidebar
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');
    const menuToggle = document.getElementById('menu-toggle');
    const closeSidebarBtn = document.getElementById('close-sidebar');

    function openSidebar() {
      if (window.sidebarSwipeCancelAnim) window.sidebarSwipeCancelAnim();
      sidebar.style.left = '';
      sidebar.style.transition = '';
      overlay.style.opacity = '';
      overlay.style.transition = '';
      overlay.style.display = '';
      if (!sidebar.classList.contains('open')) {
        if (navigator.vibrate) navigator.vibrate(10);
        sidebar.classList.add('open');
        overlay.classList.add('active');
        document.body.classList.add('no-scroll');
      }
    }

    function closeSidebar() {
      if (window.sidebarSwipeCancelAnim) window.sidebarSwipeCancelAnim();
      sidebar.style.left = '';
      sidebar.style.transition = '';
      overlay.style.opacity = '';
      overlay.style.transition = '';
      overlay.style.display = '';
      sidebar.classList.remove('open');
      overlay.classList.remove('active');
      document.body.classList.remove('no-scroll');
    }

    function toggleSidebar() {
      if (sidebar.classList.contains('open')) {
        if (navigator.vibrate) navigator.vibrate(10);
        closeSidebar();
      } else {
        openSidebar();
      }
    }

    /* ========== VUỐT CẠNH TRÁI ĐỂ MỞ/ĐÓNG MENUBAR (IPHONE STYLE) ========== */
    function setupSidebarSwipe() {
      const EDGE_THRESHOLD = 35;
      let startX = 0;
      let startY = 0;
      let currentX = 0;
      let currentY = 0;
      let isSwiping = false;
      let isClosing = false;
      let sidebarWidth = 310;
      let animTimeout = null;

      function getSidebarWidth() {
        return sidebar ? sidebar.offsetWidth || 310 : 310;
      }

      window.sidebarSwipeCancelAnim = function() {
        if (animTimeout) {
          clearTimeout(animTimeout);
          animTimeout = null;
        }
      };

      function handleTouchStart(e) {
        if (e.touches.length !== 1) return;
        const touch = e.touches[0];
        const target = touch.target;
        if (target && target.closest && target.closest('input, textarea, select')) return;

        startX = touch.clientX;
        startY = touch.clientY;
        currentX = startX;
        currentY = startY;
        sidebarWidth = getSidebarWidth();
        window.sidebarSwipeCancelAnim();

        const isOpen = sidebar.classList.contains('open');
        if (!isOpen && startX <= EDGE_THRESHOLD) {
          isSwiping = true;
          isClosing = false;
          overlay.style.display = 'block';
          overlay.style.opacity = '0';
          sidebar.style.transition = 'none';
          overlay.style.transition = 'none';
          sidebar.style.left = (-sidebarWidth) + 'px';
        } else if (isOpen) {
          isSwiping = true;
          isClosing = true;
          sidebar.style.transition = 'none';
          overlay.style.transition = 'none';
        } else {
          isSwiping = false;
        }
      }

      function handleTouchMove(e) {
        if (!isSwiping || e.touches.length !== 1) return;
        currentX = e.touches[0].clientX;
        currentY = e.touches[0].clientY;
        const deltaX = currentX - startX;
        const deltaY = currentY - startY;

        if (Math.abs(deltaY) > Math.abs(deltaX) && Math.abs(deltaX) < 10) return;

        if (!isClosing) {
          if (deltaX > 0) {
            e.preventDefault();
            const posX = Math.min(0, -sidebarWidth + deltaX);
            const progress = Math.min(1, Math.max(0, (sidebarWidth + posX) / sidebarWidth));
            sidebar.style.left = posX + 'px';
            overlay.style.opacity = (progress * 0.45).toString();
          }
        } else {
          if (deltaX < 0) {
            e.preventDefault();
            const posX = Math.min(0, Math.max(-sidebarWidth, deltaX));
            const progress = Math.min(1, Math.max(0, (sidebarWidth + posX) / sidebarWidth));
            sidebar.style.left = posX + 'px';
            overlay.style.opacity = (progress * 0.45).toString();
          }
        }
      }

      function handleTouchEnd(e) {
        if (!isSwiping) return;
        isSwiping = false;
        const deltaX = currentX - startX;
        const distance = Math.abs(deltaX);

        let shouldOpen = false;
        if (!isClosing) {
          shouldOpen = deltaX > sidebarWidth * 0.35 || distance > 80;
        } else {
          const shouldClose = deltaX < -sidebarWidth * 0.25 || distance > 60;
          shouldOpen = !shouldClose;
        }

        sidebar.style.transition = 'left 0.25s cubic-bezier(0.25, 1, 0.5, 1)';
        overlay.style.transition = 'opacity 0.25s ease';

        if (shouldOpen) {
          sidebar.style.left = '0px';
          overlay.style.opacity = '1';
          if (navigator.vibrate) navigator.vibrate(10);

          animTimeout = setTimeout(() => {
            sidebar.style.left = '';
            sidebar.style.transition = '';
            overlay.style.opacity = '';
            overlay.style.transition = '';
            overlay.style.display = '';
            sidebar.classList.add('open');
            overlay.classList.add('active');
            document.body.classList.add('no-scroll');
          }, 250);
        } else {
          sidebar.style.left = (-sidebarWidth) + 'px';
          overlay.style.opacity = '0';

          animTimeout = setTimeout(() => {
            sidebar.style.left = '';
            sidebar.style.transition = '';
            overlay.style.opacity = '';
            overlay.style.transition = '';
            overlay.style.display = '';
            sidebar.classList.remove('open');
            overlay.classList.remove('active');
            document.body.classList.remove('no-scroll');
          }, 250);
        }
      }

      window.addEventListener('touchstart', handleTouchStart, { passive: true });
      window.addEventListener('touchmove', handleTouchMove, { passive: false });
      window.addEventListener('touchend', handleTouchEnd, { passive: true });
      window.addEventListener('touchcancel', handleTouchEnd, { passive: true });
    }

    menuToggle.addEventListener('click', toggleSidebar);
    closeSidebarBtn.addEventListener('click', closeSidebar);
    overlay.addEventListener('click', closeSidebar);
    setupSidebarSwipe();

    // Toast Notification
    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      const toastMessage = document.getElementById('toast-message');
      toastMessage.textContent = message;
      toast.className = `toast ${type} show`;
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2400);
    }

    // Sao chép clipboard
    async function copyToClipboard(text) {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          return true;
        } else {
          const textArea = document.createElement('textarea');
          textArea.value = text;
          textArea.style.position = 'fixed';
          textArea.style.opacity = '0';
          document.body.appendChild(textArea);
          textArea.select();
          const success = document.execCommand('copy');
          document.body.removeChild(textArea);
          return success;
        }
      } catch (err) {
        console.error('Lỗi sao chép clipboard:', err);
        return false;
      }
    }

    // Biến lưu trữ lịch sử
    let clipboardHistory = [];

    // Tải lịch sử từ localStorage
    function loadHistory() {
      try {
        clipboardHistory = JSON.parse(localStorage.getItem('clipboard_history') || '[]');
      } catch (e) {
        console.error('Lỗi tải dữ liệu clipboard_history:', e);
        clipboardHistory = [];
      }
      renderHistory();
    }

    // Badge CSS class tương ứng
    function getBadgeClass(type) {
      if (type === 'Báo cáo cuối ca') return 'badge-report';
      if (type === 'Xuất data của ca') return 'badge-export';
      return 'badge-other';
    }

    // Nhóm lịch sử theo ngày
    function groupHistoryByDate(items) {
      const groups = {};
      const todayStr = new Date().toLocaleDateString('vi-VN');
      
      const yesterday = new Date();
      yesterday.setDate(yesterday.getDate() - 1);
      const yesterdayStr = yesterday.toLocaleDateString('vi-VN');

      items.forEach(item => {
        const itemDate = new Date(item.timestamp);
        const itemDateStr = itemDate.toLocaleDateString('vi-VN');
        
        let groupTitle = `Ngày ${itemDateStr}`;
        if (itemDateStr === todayStr) {
          groupTitle = `Hôm nay - ${itemDateStr}`;
        } else if (itemDateStr === yesterdayStr) {
          groupTitle = `Hôm qua - ${itemDateStr}`;
        }

        if (!groups[groupTitle]) {
          groups[groupTitle] = [];
        }
        groups[groupTitle].push(item);
      });
      return groups;
    }

    // Render danh sách
    function renderHistory() {
      const container = document.getElementById('history-container');
      const searchQuery = document.getElementById('search-input').value.toLowerCase().trim();
      const filterType = document.getElementById('filter-type').value;

      const filteredItems = clipboardHistory.filter(item => {
        const matchesSearch = item.content.toLowerCase().includes(searchQuery);
        let matchesType = true;
        if (filterType === 'report') {
          matchesType = item.type === 'Báo cáo cuối ca';
        } else if (filterType === 'export') {
          matchesType = item.type === 'Xuất data của ca';
        } else if (filterType === 'other') {
          matchesType = item.type === 'Khác';
        }
        return matchesSearch && matchesType;
      });

      if (filteredItems.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">
              <svg class="hero-icon" style="width: 44px; height: 44px; margin: 0 auto; display: block;" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M2 4.75C2 3.784 2.784 3 3.75 3h4.836c.464 0 .909.184 1.237.513l1.414 1.414a.25.25 0 00.177.073h4.836c.966 0 1.75.784 1.75 1.75v8.5A1.75 1.75 0 0116.25 17H3.75A1.75 1.75 0 012 15.25V4.75zm10.25 7a.75.75 0 000-1.5H7.75a.75.75 0 000 1.5h4.5z" clip-rule="evenodd" />
              </svg>
            </div>
            <p>Không tìm thấy lịch sử clipboard nào phù hợp.</p>
          </div>
        `;
        return;
      }

      const grouped = groupHistoryByDate(filteredItems);
      let html = '';

      Object.keys(grouped).forEach(dateTitle => {
        html += `
          <div class="date-group">
            <div class="date-header">
              <svg class="hero-icon hero-icon-sm" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.75 2a.75.75 0 01.75.75V4h7V2.75a.75.75 0 011.5 0V4h.25A2.75 2.75 0 0118 6.75v8.5A2.75 2.75 0 0115.25 18H4.75A2.75 2.75 0 012 15.25v-8.5A2.75 2.75 0 014.75 4H5V2.75A.75.75 0 015.75 2zm-1 5.5c-.69 0-1.25.56-1.25 1.25v6.5c0 .69.56 1.25 1.25 1.25h10.5c.69 0 1.25-.56 1.25-1.25v-6.5c0-.69-.56-1.25-1.25-1.25H4.75z" clip-rule="evenodd" /></svg>
              ${dateTitle}
            </div>
        `;

        grouped[dateTitle].forEach(item => {
          const itemDate = new Date(item.timestamp);
          const timeStr = itemDate.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
          const escapedContent = escapeHTML(item.content);
          
          html += `
            <div class="clipboard-card">
              <div class="card-meta">
                <div class="badge-time-group">
                  <span class="badge ${getBadgeClass(item.type)}">${item.type}</span>
                  <span class="time-text">🕒 ${timeStr}</span>
                </div>
                <div class="card-actions">
                  <button class="btn-icon btn-primary" onclick="copyItemContent(this, '${item.timestamp}')">
                    <svg class="hero-icon hero-icon-sm" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M15.988 3.012A2.25 2.25 0 0118 5.25v6.5A2.25 2.25 0 0115.75 14H13.5v-1.5h2.25a.75.75 0 00.75-.75v-6.5a.75.75 0 00-.75-.75h-7.5a.75.75 0 00-.75.75V7H6v-.75A2.25 2.25 0 018.25 3h7.738z" clip-rule="evenodd" /><path fill-rule="evenodd" d="M2 9.25A2.25 2.25 0 014.25 7h7.5A2.25 2.25 0 0114 9.25v7.5A2.25 2.25 0 0111.75 19h-7.5A2.25 2.25 0 012 16.75v-7.5zm2.25-.75a.75.75 0 00-.75.75v7.5c0 .414.336.75.75.75h7.5a.75.75 0 00.75-.75v-7.5a.75.75 0 00-.75-.75h-7.5z" clip-rule="evenodd" /></svg>
                    Sao chép lại
                  </button>
                  <button class="btn-icon btn-danger" onclick="deleteItem('${item.timestamp}')">
                    <svg class="hero-icon hero-icon-sm" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M8.75 1A2.75 2.75 0 006 3.75v.443c-.795.077-1.584.176-2.365.298a.75.75 0 10.23 1.482l.149-.022.841 10.518A2.75 2.75 0 007.596 19h4.807a2.75 2.75 0 002.742-2.53l.841-10.52.149.023a.75.75 0 00.23-1.482A41.03 41.03 0 0014 4.193V3.75A2.75 2.75 0 0011.25 1h-2.5zM10 4c.84 0 1.673.025 2.5.075V3.75c0-.69-.56-1.25-1.25-1.25h-2.5c-.69 0-1.25.56-1.25 1.25v.325C8.327 4.025 9.16 4 10 4zM8.58 7.72a.75.75 0 00-1.5.06l.3 7.5a.75.75 0 101.5-.06l-.3-7.5zm4.34.06a.75.75 0 10-1.5-.06l-.3 7.5a.75.75 0 101.5.06l.3-7.5z" clip-rule="evenodd" /></svg>
                    Xóa
                  </button>
                </div>
              </div>
              <pre class="clipboard-text">${escapedContent}</pre>
            </div>
          `;
        });

        html += `</div>`;
      });

      container.innerHTML = html;
    }

    // Escape ký tự HTML để an toàn chống XSS
    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          "'": '&#39;',
          '"': '&quot;'
        }[tag] || tag)
      );
    }

    // Thực hiện sao chép lại
    window.copyItemContent = async function(btn, timestamp) {
      const item = clipboardHistory.find(i => i.timestamp === timestamp);
      if (item) {
        const success = await copyToClipboard(item.content);
        if (success) {
          showToast('Đã sao chép lại nội dung vào clipboard!');
          updateTimestampAndMoveToTop(item);
        } else {
          showToast('Sao chép thất bại', 'error');
        }
      }
    };

    // Đẩy lịch sử đã dùng lại lên đầu
    function updateTimestampAndMoveToTop(item) {
      const index = clipboardHistory.indexOf(item);
      if (index > -1) {
        clipboardHistory.splice(index, 1);
      }
      item.timestamp = new Date().toISOString();
      clipboardHistory.unshift(item);
      localStorage.setItem('clipboard_history', JSON.stringify(clipboardHistory));
      renderHistory();
    }

    // Xóa một dòng lịch sử
    window.deleteItem = function(timestamp) {
      if (confirm('Bạn có chắc chắn muốn xóa dòng lịch sử này không?')) {
        clipboardHistory = clipboardHistory.filter(i => i.timestamp !== timestamp);
        localStorage.setItem('clipboard_history', JSON.stringify(clipboardHistory));
        renderHistory();
        showToast('Đã xóa mục khỏi lịch sử');
      }
    };

    // Xóa toàn bộ lịch sử
    document.getElementById('btn-clear-all').addEventListener('click', () => {
      if (clipboardHistory.length === 0) {
        showToast('Không có dữ liệu lịch sử nào để xóa', 'error');
        return;
      }
      if (confirm('Bạn có chắc chắn muốn xóa TOÀN BỘ lịch sử clipboard không? Hành động này không thể hoàn tác!')) {
        clipboardHistory = [];
        localStorage.removeItem('clipboard_history');
        renderHistory();
        showToast('Đã xóa sạch toàn bộ lịch sử clipboard');
      }
    });

    // Sự kiện tìm kiếm và bộ lọc loại dữ liệu
    document.getElementById('search-input').addEventListener('input', renderHistory);
    document.getElementById('filter-type').addEventListener('change', renderHistory);

    // Khởi tạo ban đầu
    window.addEventListener('load', loadHistory);
  </script>
</body>
</html>
