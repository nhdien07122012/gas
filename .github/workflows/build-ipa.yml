name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Environment
        run: |
          xcodebuild -version
          node -v
          npm -v

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install

      - name: Prepare web assets
        run: |
          mkdir -p www/assets
          cp -r *.html www/ 2>/dev/null || true
          cp -r *.png www/ 2>/dev/null || true
          cp -r assets/* www/assets/ 2>/dev/null || true

      - name: Generate Native iOS Project on macOS
        run: |
          rm -rf ios
          npx cap add ios
          npx cap sync ios

      - name: Build iOS App with Xcode (Unsigned)
        run: |
          cd ios/App
          if [ -d "App.xcworkspace" ]; then
            TARGET="-workspace App.xcworkspace"
          else
            TARGET="-project App.xcodeproj"
          fi
          xcodebuild $TARGET \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY="" \
            clean build

      - name: Package unsigned IPA
        run: |
          cd ios/App/build/Build/Products/Debug-iphoneos
          mkdir -p Payload
          cp -r App.app Payload/
          zip -qr VNPost-Gas-Manager.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VNPost-Gas-Manager-iOS-IPA
          path: ios/App/build/Build/Products/Debug-iphoneos/VNPost-Gas-Manager.ipa
          retention-days: 14
