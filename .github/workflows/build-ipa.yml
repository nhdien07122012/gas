name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Environment
        run: |
          xcodebuild -version
          node -v
          npm -v

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install

      - name: Prepare web assets
        run: |
          mkdir -p www/assets
          cp -r *.html www/ 2>/dev/null || true
          cp -r *.png www/ 2>/dev/null || true
          cp -r assets/* www/assets/ 2>/dev/null || true

      - name: Sync Web Assets to Native iOS Project on macOS
        run: |
          npx cap sync ios

      - name: Apply Custom Native iOS Files (AppIcon, Info.plist, SceneDelegate, GasWidget)
        run: |
          mkdir -p ios/App/App/Assets.xcassets/AppIcon.appiconset
          cp -r resources/ios/AppIcon/* ios/App/App/Assets.xcassets/AppIcon.appiconset/
          cp resources/ios/Info.plist ios/App/App/Info.plist
          cp resources/ios/SceneDelegate.swift ios/App/App/SceneDelegate.swift
          cp resources/ios/project.pbxproj ios/App/App.xcodeproj/project.pbxproj
          mkdir -p ios/App/GasWidget
          cp -r resources/ios/GasWidget/* ios/App/GasWidget/

      - name: Build iOS App and Widget Extension with Xcode (Unsigned)
        run: |
          cd ios/App
          if [ -d "App.xcworkspace" ]; then
            TARGET="-workspace App.xcworkspace"
          else
            TARGET="-project App.xcodeproj"
          fi
          echo "=== Building App and GasWidgetExtension with scheme App ==="
          set -o pipefail
          xcodebuild $TARGET \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log || {
              echo "=== XCODEBUILD FAILED: Showing error summary ==="
              grep -E "error:|FAILED" xcodebuild.log | head -n 40
              exit 1
            }

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-failure-log
          path: ios/App/xcodebuild.log

      - name: Package unsigned IPA (including PlugIns / GasWidgetExtension)
        run: |
          cd ios/App/build/Build/Products/Debug-iphoneos
          mkdir -p Payload
          cp -r App.app Payload/
          mkdir -p Payload/App.app/PlugIns
          if [ -d "GasWidgetExtension.appex" ]; then
            echo "Copying GasWidgetExtension.appex into Payload/App.app/PlugIns/..."
            cp -r GasWidgetExtension.appex Payload/App.app/PlugIns/
          fi
          echo "=== Content of Payload/App.app/PlugIns ==="
          ls -la Payload/App.app/PlugIns
          zip -qr Gas-Manager.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gas-Manager-iOS-IPA
          path: ios/App/build/Build/Products/Debug-iphoneos/Gas-Manager.ipa
          retention-days: 14
