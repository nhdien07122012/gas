<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Quản lý vị trí điểm gas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">

<style>
  /* ========== VNPOST DESIGN SYSTEM ========== */
  :root {
    --vnpost-blue: #005ba6;
    --vnpost-blue-dark: #00457c;
    --vnpost-blue-light: rgba(0, 91, 166, 0.08);
    --vnpost-gold: #f59e0b;
    --vnpost-gold-dark: #d97706;
    --vnpost-gold-light: rgba(245, 158, 11, 0.12);

    --primary: var(--vnpost-blue);
    --primary-dark: var(--vnpost-blue-dark);
    --primary-light: var(--vnpost-blue-light);

    --color-success: #10b981;
    --color-success-light: rgba(16, 185, 129, 0.12);
    --color-warning: #f59e0b;
    --color-warning-light: rgba(245, 158, 11, 0.12);
    --color-danger: #ef4444;
    --color-danger-light: rgba(239, 68, 68, 0.12);

    --bg-page: #f8fafc;
    --bg-card: #ffffff;
    --bg-secondary: #f1f5f9;
    --bg-tertiary: #e2e8f0;
    --bg-input: #ffffff;
    --bg-hover: #f1f5f9;

    --border-card: #e2e8f0;
    --border-light: #f1f5f9;
    --border-dark: #cbd5e1;

    --text-main: #0f172a;
    --text-primary: #0f172a;
    --text-secondary: #475569;
    --text-muted: #64748b;
    --text-tertiary: #94a3b8;
    --text-inverse: #ffffff;

    --font-family: 'Be Vietnam Pro', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;

    --radius-xs: 6px;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-xl: 20px;

    --shadow-sm: 0 1px 2px 0 rgba(15, 23, 42, 0.05);
    --shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.07), 0 2px 4px -2px rgba(15, 23, 42, 0.05);
    --shadow-md: 0 10px 15px -3px rgba(15, 23, 42, 0.08);

    --transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  }

  html[data-theme="dark"] {
    color-scheme: dark;
    --bg-page: #0b0f19;
    --bg-card: #131b2e;
    --bg-secondary: #1a243b;
    --bg-tertiary: #22304d;
    --bg-input: #1a243b;
    --bg-hover: #22304d;

    --border-card: #1e293b;
    --border-light: #1a243b;
    --border-dark: #334155;

    --text-main: #f8fafc;
    --text-primary: #f8fafc;
    --text-secondary: #cbd5e1;
    --text-muted: #94a3b8;
    --text-tertiary: #64748b;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg-page: #0b0f19;
      --bg-card: #131b2e;
      --bg-secondary: #1a243b;
      --bg-tertiary: #22304d;
      --bg-input: #1a243b;
      --bg-hover: #22304d;

      --border-card: #1e293b;
      --border-light: #1a243b;
      --border-dark: #334155;

      --text-main: #f8fafc;
      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --text-tertiary: #64748b;
    }
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-family);
    background-color: var(--bg-page);
    color: var(--text-main);
    line-height: 1.5;
    padding: calc(16px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) calc(16px + env(safe-area-inset-left, 0px));
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }

  .container {
    max-width: 680px;
    margin: 0 auto;
    background: var(--bg-card);
    border-radius: var(--radius-xl);
    border: 1px solid var(--border-card);
    box-shadow: var(--shadow-md);
    overflow: hidden;
  }

  .hero-icon {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    display: inline-block;
    vertical-align: middle;
    color: currentColor;
  }
  .hero-icon-sm { width: 16px; height: 16px; }

  /* App Header (Centered Title) */
  .app-header {
    background: linear-gradient(135deg, var(--vnpost-blue) 0%, #00457c 100%);
    color: white;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    text-align: center;
  }

  .menu-back {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255, 255, 255, 0.15);
    border: 1px solid rgba(255, 255, 255, 0.25);
    color: white;
    width: 36px;
    height: 36px;
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: var(--transition);
    flex-shrink: 0;
    z-index: 2;
  }
  .menu-back:hover {
    background: rgba(255, 255, 255, 0.28);
    transform: translateY(-50%) translateX(-2px);
  }

  .header-brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    width: 100%;
    padding: 0 44px;
  }
  .header-logo-wrap {
    width: 34px;
    height: 34px;
    border-radius: var(--radius-md);
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4px;
    box-shadow: var(--shadow-sm);
    flex-shrink: 0;
  }
  .header-logo {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }
  .header-text {
    flex: 1;
    min-width: 0;
  }
  .header-title-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .header-title-row h1 {
    font-size: 17px;
    font-weight: 700;
    margin: 0;
    line-height: 1.25;
    letter-spacing: -0.015em;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .header-count {
    font-size: 15.5px;
    font-weight: 600;
    opacity: 0.88;
    letter-spacing: normal;
  }
  .header-badge {
    background: var(--vnpost-gold);
    color: #78350f;
    font-size: 10.5px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 9999px;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }
  .header-subtitle {
    font-size: 13.5px;
    color: rgba(255, 255, 255, 0.85);
    margin-top: 2px;
    line-height: 1.3;
  }

  /* Search Bar */
  .search-section {
    padding: 14px 18px;
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border-card);
  }
  .search-group {
    position: relative;
    display: flex;
    align-items: center;
  }
  .search-icon {
    position: absolute;
    left: 12px;
    color: var(--text-muted);
    pointer-events: none;
    display: flex;
    align-items: center;
  }
  /* Chống iOS Safari tự động zoom màn hình trên iPhone (yêu cầu font-size >= 16px) */
  input, select, textarea {
    font-size: 16px !important;
  }
  .search-group input {
    width: 100%;
    padding: 10px 12px 10px 38px;
    background: var(--bg-card);
    border: 1px solid var(--border-card);
    border-radius: var(--radius-md);
    color: var(--text-main);
    font-size: 16px !important;
    font-family: inherit;
    outline: none;
    transition: var(--transition);
  }
  .search-group input:focus {
    border-color: var(--vnpost-blue);
    box-shadow: 0 0 0 3px var(--vnpost-blue-light);
  }

  /* Location Grid */
  .location-grid {
    padding: 18px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }

  .location-card {
    background: var(--bg-card);
    border: 1px solid var(--border-card);
    border-radius: var(--radius-md);
    padding: 14px;
    box-shadow: var(--shadow-sm);
    transition: var(--transition);
    display: flex;
    flex-direction: column;
    gap: 10px;
    overflow: hidden;
  }
  .location-card:hover {
    border-color: var(--vnpost-blue);
    box-shadow: var(--shadow);
  }

  .card-header {
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .card-icon {
    width: 36px;
    height: 36px;
    border-radius: var(--radius-sm);
    background: var(--vnpost-blue-light);
    color: var(--vnpost-blue);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .card-info {
    flex: 1;
    min-width: 0;
  }
  .card-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--text-main);
    line-height: 1.3;
  }
  .card-address {
    font-size: 13.5px;
    color: var(--text-muted);
    margin-top: 3px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .card-address span {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-details {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 6px;
    padding: 8px 10px;
    background: var(--bg-secondary);
    border-radius: var(--radius-sm);
    font-size: 12.5px;
  }
  .gps-label {
    color: var(--text-muted);
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .badge-gps {
    font-family: var(--font-mono);
    background: var(--bg-card);
    border: 1px solid var(--border-card);
    padding: 3px 8px;
    border-radius: 9999px;
    color: var(--vnpost-blue);
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11.5px;
    letter-spacing: -0.01em;
    max-width: 100%;
    box-sizing: border-box;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: var(--transition-fast);
  }
  .badge-gps:hover {
    background: var(--vnpost-blue-light);
    border-color: var(--vnpost-blue);
  }

  .btn-maps {
    padding: 9px 12px;
    border-radius: var(--radius-sm);
    background: linear-gradient(135deg, var(--vnpost-blue) 0%, #0284c7 100%);
    color: white;
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: var(--transition);
    box-shadow: var(--shadow-sm);
  }
  .btn-maps:hover {
    transform: translateY(-1px);
    box-shadow: var(--shadow);
  }

  /* Empty State */
  #empty-state {
    padding: 40px 20px;
    text-align: center;
    color: var(--text-muted);
    display: none;
  }
  #empty-state h3 {
    font-size: 15px;
    font-weight: 700;
    color: var(--text-main);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  /* Page Loading Overlay (Đồng bộ 100% với index.html) */
  .page-loader-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: var(--bg-page);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    opacity: 1;
    visibility: visible;
    transition: opacity 0.3s ease, visibility 0.3s ease;
  }
  .page-loader-overlay.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .loader {
    width: 32px;
    height: 32px;
    aspect-ratio: 1;
    border-radius: 50%;
    border: 3px solid var(--border-card);
    border-top-color: var(--vnpost-blue);
    animation: loader-spin 0.8s linear infinite;
  }
  @keyframes loader-spin {
    to { transform: rotate(360deg); }
  }

  .back-button {
    display: none;
  }

  @media (max-width: 480px) {
    body { padding: calc(8px + env(safe-area-inset-top, 0px)) calc(8px + env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) calc(8px + env(safe-area-inset-left, 0px)); }
    .container { border-radius: var(--radius-lg); }
    .location-grid { padding: 12px; }
    input, select, textarea { font-size: 16px !important; }
  }

  /* ========== FLOATING TOAST (Pill Style 2.4s) ========== */
  .toast {
    position: fixed;
    top: max(16px, calc(env(safe-area-inset-top, 0px) + 12px));
    left: 50%;
    transform: translateX(-50%) translateY(-40px);
    padding: 10px 18px;
    border-radius: 9999px;
    font-size: 13.5px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 10px 20px -3px rgba(0, 0, 0, 0.14), 0 4px 6px -4px rgba(0, 0, 0, 0.08);
    opacity: 0;
    pointer-events: none;
    transition: all 0.24s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 9999;
    max-width: 90%;
    text-align: center;
    white-space: nowrap;
    background: #0f172a;
    color: #f8fafc;
    border: 1px solid #334155;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
    pointer-events: auto;
  }

  .toast.success, .toast.toast-success {
    background: #064e3b;
    color: #ecfdf5;
    border: 1px solid #059669;
  }
  .toast.warning, .toast.toast-warning {
    background: #78350f;
    color: #fffbeb;
    border: 1px solid #d97706;
  }
  .toast.error, .toast.danger, .toast.toast-error {
    background: #7f1d1d;
    color: #fef2f2;
    border: 1px solid #dc2626;
  }
  .toast.info, .toast.toast-info {
    background: #0f172a;
    color: #f8fafc;
    border: 1px solid #334155;
  }


  /* ========== UNIFIED APP HEADER (VNPost Brand Style) ========== */
  .app-header {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px 20px;
    background: var(--bg-card);
    border-bottom: 1px solid var(--border-card);
    position: relative;
    text-align: center;
    border-top-left-radius: inherit;
    border-top-right-radius: inherit;
  }

  .menu-toggle {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    background: var(--bg-subtle, var(--bg-tertiary, #f1f5f9));
    border: 1px solid var(--border-card, #e2e8f0);
    border-radius: 10px;
    color: var(--text-main, var(--text-primary, #0f172a));
    width: 40px;
    height: 40px;
    padding: 0;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    z-index: 2;
  }
  .menu-toggle:hover {
    background: var(--bg-hover, #f1f5f9);
    color: var(--vnpost-blue, #005ba6);
    border-color: var(--vnpost-blue-border, #bfdbfe);
  }
  .menu-toggle:active {
    transform: translateY(-50%) scale(0.95);
  }

  .header-home-btn {
    position: absolute;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    background: var(--bg-subtle, var(--bg-tertiary, #f1f5f9));
    border: 1px solid var(--border-card, #e2e8f0);
    border-radius: 10px;
    color: var(--text-main, var(--text-primary, #0f172a));
    width: 40px;
    height: 40px;
    padding: 0;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    z-index: 2;
  }
  .header-home-btn:hover {
    background: var(--bg-hover, #f1f5f9);
    color: var(--vnpost-blue, #005ba6);
    border-color: var(--vnpost-blue-border, #bfdbfe);
  }
  .header-home-btn:active {
    transform: translateY(-50%) scale(0.95);
  }

  .brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    width: 100%;
    padding: 0 52px;
    min-width: 0;
  }
  .brand-info {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    min-width: 0;
    max-width: 100%;
  }
  .brand-title-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    max-width: 100%;
  }
  .brand-title {
    margin: 0;
    font-size: 20.5px;
    font-weight: 700;
    color: var(--vnpost-blue, #005ba6);
    letter-spacing: -0.015em;
    line-height: 1.25;
  }
  .brand-subtitle {
    font-size: 14.5px;
    color: var(--text-secondary, #334155);
    font-weight: 500;
    line-height: 1.35;
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }

  /* ========== UNIFIED SIDEBAR DRAWER ========== */
  .overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(15, 23, 42, 0.4);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
    z-index: 1000;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.22s ease, visibility 0.22s;
    will-change: opacity;
  }
  .overlay.open, .overlay.active {
    opacity: 1;
    visibility: visible;
  }

  .sidebar {
    position: fixed;
    top: 0; left: -330px;
    width: 310px;
    max-width: 85vw;
    height: 100%;
    background: var(--bg-sidebar, var(--bg-card, #ffffff));
    box-shadow: 0 10px 20px -3px rgb(0 0 0 / 0.14), 0 4px 6px -4px rgb(0 0 0 / 0.08);
    z-index: 1001;
    transition: left 0.22s cubic-bezier(0.25, 1, 0.5, 1);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border-card, #e2e8f0);
    touch-action: pan-y;
    will-change: left;
  }
  .sidebar.open { left: 0; }
  .sidebar.swiping { transition: none !important; will-change: left; }

  .sidebar-header {
    padding: calc(18px + env(safe-area-inset-top, 0px)) 20px 18px;
    background: linear-gradient(135deg, var(--vnpost-blue, #005ba6), var(--vnpost-blue-hover, #004680));
    color: #ffffff;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .sidebar-header h2 {
    font-size: 19px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: -0.2px;
    margin: 0;
  }
  .close-sidebar {
    background: transparent;
    border: none;
    color: #ffffff;
    cursor: pointer;
    padding: 6px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.15s ease;
  }
  .close-sidebar:hover { opacity: 0.8; }

  .sidebar-content {
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
  }

  .sidebar-item {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 12px 16px;
    border: 1px solid transparent;
    border-radius: 8px;
    background: transparent;
    color: var(--text-secondary, #334155);
    font-family: inherit;
    font-size: 16.5px;
    font-weight: 600;
    cursor: pointer;
    text-align: left;
    transition: all 0.12s ease;
  }
  .sidebar-item:hover {
    background: var(--bg-hover, #f1f5f9);
    color: var(--vnpost-blue, #005ba6);
  }
  .sidebar-item:active { transform: scale(0.98); }
  .sidebar-item.active {
    background: var(--vnpost-blue-light, rgba(0, 91, 166, 0.1));
    color: var(--vnpost-blue, #005ba6);
    border-color: var(--vnpost-blue-border, #bfdbfe);
  }

  .sidebar-item .hero-icon,
  .sidebar-item #theme-icon svg {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    color: var(--text-muted, #94a3b8);
  }
  .sidebar-item:hover .hero-icon,
  .sidebar-item:hover #theme-icon svg,
  .sidebar-item.active .hero-icon {
    color: var(--vnpost-blue, #005ba6);
  }

  .sidebar-footer {
    padding: 16px 20px calc(16px + env(safe-area-inset-bottom, 0px));

// Loại bỏ emoji ở đầu chuỗi thông báo (nếu còn sót)
function stripLeadingEmoji(str) {
  if (!str) return '';
  return str.replace(/^[\u{1F000}-\u{1FAFF}\u{2190}-\u{27BF}\u{2B00}-\u{2BFF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{FE0F}\u{200D}\s]+/u, '').trim() || str.trim();
}

const scriptURL = 'https://script.google.com/macros/s/AKfycbyRnnoEd2BnD7u1pXHER17Cv95BN9Z77yUeO6oR7CFRtbUqd-SiVJqBv5ENYyARwX77fw/exec';
let allData = [];
let vitriData = [];
let currentFilteredData = [];

function extractGPS(note) {
  const noteStr = note == null ? '' : String(note);
  if (!noteStr.trim()) return null;
  const match = noteStr.match(/\[GPS:\s*([\d.]+),\s*([\d.]+)\]/);
  if (match) {
    const lat = parseFloat(match[1]);
    const lng = parseFloat(match[2]);
    if (!isNaN(lat) && !isNaN(lng)) {
      return {
        lat: lat.toFixed(6),
        lng: lng.toFixed(6),
        rawLat: lat,
        rawLng: lng
      };
    }
  }
  return null;
}

function escapeHtml(text) {
  if (text == null) return '';
  const str = String(text);
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function displayVitri(data) {
  const gridContainer = document.getElementById('location-grid');
  const emptyState = document.getElementById('empty-state');

  if (!data || data.length === 0) {
    if (gridContainer) gridContainer.innerHTML = '';
    if (emptyState) emptyState.style.display = 'block';
    return;
  }

  if (gridContainer) gridContainer.innerHTML = '';
  let count = 0;

  data.forEach(row => {
    const gps = extractGPS(row.ghi_chu);
    if (!gps) return;

    count++;
    const card = document.createElement('div');
    card.className = 'location-card fade-in';

    const tenDiem = escapeHtml(row.ten_diem) || 'Chưa có tên';
    const diaChi = escapeHtml(row.dia_chi) || 'Chưa có địa chỉ';

    card.innerHTML = `
      <div>
        <div class="card-header">
          <div class="card-icon">${ICONS.buildingStorefront}</div>
          <div class="card-info">
            <div class="card-title">${tenDiem}</div>
            <div class="card-address">${ICONS.mapPin} <span>${diaChi}</span></div>
          </div>
        </div>
      </div>

      <div class="card-details">
        <span class="gps-label">${ICONS.globeAlt} Tọa độ GPS:</span>
        <div class="badge-gps badge" data-coords="${gps.lat}, ${gps.lng}" title="Nhấn để sao chép tọa độ">
          ${ICONS.clipboard} ${gps.lat}, ${gps.lng}
        </div>
      </div>

      <a class="btn-maps" href="https://maps.google.com/?q=${gps.rawLat},${gps.rawLng}" target="_blank" title="Mở Google Maps dẫn đường">
        ${ICONS.map} Mở Google Maps
      </a>
    `;

    if (gridContainer) gridContainer.appendChild(card);
  });

  if (count === 0) {
    if (emptyState) {
      emptyState.style.display = 'block';
      emptyState.innerHTML = `
        <h3>
          <svg class="hero-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M6.912 3a3 3 0 0 0-2.868 2.118l-2.411 7.838a3 3 0 0 0-.133.882V18a3 3 0 0 0 3 3h15a3 3 0 0 0 3-3v-4.162c0-.299-.045-.596-.133-.882l-2.412-7.838A3 3 0 0 0 17.088 3H6.912Zm13.823 9.75-2.213-7.191A1.5 1.5 0 0 0 17.088 4.5H6.912a1.5 1.5 0 0 0-1.434 1.059L3.265 12.75H6.11a3 3 0 0 1 2.684 1.658l.256.513a1.5 1.5 0 0 0 1.342.829h3.218a1.5 1.5 0 0 0 1.342-.83l.256-.512a3 3 0 0 1 2.684-1.658h2.844Z" clip-rule="evenodd" />
          </svg>
          Không tìm thấy vị trí
        </h3>
        <p>Không có điểm gas nào có tọa độ GPS trong dữ liệu hiện tại.</p>
        <p style="font-size: 0.9rem; margin-top: 10px;">
          <em>Lưu ý: Chỉ những điểm gas có tọa độ GPS mới hiển thị ở đây.</em>
        </p>
      `;
    }
  } else {
    if (emptyState) emptyState.style.display = 'none';
  }

  updateResultCount(count);
}

function updateResultCount(count) {
  const countEl = document.getElementById('header-count');
  if (countEl) {
    countEl.textContent = (typeof count === 'number' && count > 0) ? `(${count})` : '';
  }
}

function filterVitri() {
  const query = document.getElementById('search').value.toLowerCase().trim();
  if (!query) {
    currentFilteredData = vitriData;
    displayVitri(vitriData);
    return;
  }

  const filtered = vitriData.filter(row => {
    const searchableText = `
      ${row.ten_diem || ''}
      ${row.dia_chi || ''}
      ${row.ghi_chu || ''}
    `.toLowerCase();
    return searchableText.includes(query);
  });

  currentFilteredData = filtered;
  displayVitri(filtered);
}

async function copyToClipboard(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      showToast(`Đã sao chép: ${text}`, 'success');
    } else {
      const textArea = document.createElement('textarea');
      textArea.value = text;
      textArea.style.position = 'fixed';
      textArea.style.opacity = '0';
      document.body.appendChild(textArea);
      textArea.select();
      const success = document.execCommand('copy');
      document.body.removeChild(textArea);
      if (success) {
        showToast(`Đã sao chép: ${text}`, 'success');
      } else {
        showToast('Không thể sao chép vào clipboard', 'error');
      }
    }
  } catch (err) {
    console.error('Lỗi sao chép:', err);
    showToast('Lỗi khi sao chép', 'error');
  }
}

function showToast(message, type = 'success') {
  let toast = document.getElementById('toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'toast';
    toast.className = 'toast';
    toast.innerHTML = '<span class="toast-icon" id="toast-icon"></span><span id="toast-message"></span>';
    document.body.appendChild(toast);
  }
  const toastMessage = document.getElementById('toast-message') || toast.querySelector('#toast-message') || toast;
  const toastIcon = document.getElementById('toast-icon') || toast.querySelector('#toast-icon');

  let iconKey = 'checkCircle';
  if (type === 'error' || type === 'danger') iconKey = 'xCircle';
  else if (type === 'warning') iconKey = 'warning';
  else if (type === 'info') iconKey = 'info';

  if (toastIcon) toastIcon.innerHTML = ICONS[iconKey] || '';
  if (toastMessage) toastMessage.textContent = stripLeadingEmoji(message);

  const toastClass = type === 'danger' ? 'error' : type;
  toast.className = `toast toast-${toastClass} show`;
  if (window.toastTimer) clearTimeout(window.toastTimer);
  window.toastTimer = setTimeout(() => {
    toast.classList.remove('show');
  }, 2400);
}

function applyVitriData(data) {
  if (!Array.isArray(data)) return [];
  allData = data;
  vitriData = allData.filter(row => extractGPS(row.ghi_chu) !== null);

  const uniqueMap = new Map();
  vitriData.forEach(row => {
    const gps = extractGPS(row.ghi_chu);
    if (gps) {
      const key = `${row.ten_diem || ''}_${gps.lat}_${gps.lng}`;
      if (!uniqueMap.has(key)) uniqueMap.set(key, row);
    }
  });
  vitriData = Array.from(uniqueMap.values());
  currentFilteredData = vitriData;
  displayVitri(vitriData);
  return vitriData;
}

function loadCachedVitriData() {
  try {
    // 1. Thử đọc từ cache riêng của vitri
    let raw = localStorage.getItem('gas_vitri_cache');
    let parsed = raw ? JSON.parse(raw) : null;
    let list = Array.isArray(parsed?.data) ? parsed.data : null;

    // 2. Nếu chưa có, đọc ngay từ cache chung của index.html ('gas_point_cached_data_v2')
    if (!list) {
      raw = localStorage.getItem('gas_point_cached_data_v2');
      parsed = raw ? JSON.parse(raw) : null;
      list = Array.isArray(parsed?.data) ? parsed.data : (Array.isArray(parsed) ? parsed : null);
    }

    if (list && list.length > 0) {
      console.log(`Đã nạp sẵn ${list.length} bản ghi từ cache`);
      applyVitriData(list);
      return true;
    }
  } catch (err) {
    console.warn('Lỗi đọc cache dữ liệu vị trí:', err);
  }
  return false;
}

async function taiDuLieu() {
  const loader = document.getElementById('page-loader');
  if (loader) loader.classList.remove('hidden');
  const startTime = Date.now();

  try {
    console.log('Đang tải dữ liệu...');
    const url = scriptURL + '?t=' + Date.now();
    const response = await fetch(url);

    if (!response.ok) throw new Error(`Lỗi HTTP ${response.status}`);

    const text = await response.text();
    let data;

    try {
      data = JSON.parse(text);
    } catch (parseError) {
      const fixedText = text.trim();
      if (fixedText.startsWith('[') && fixedText.endsWith(']')) {
        data = JSON.parse(fixedText);
      } else {
        throw new Error('Dữ liệu không phải JSON hợp lệ');
      }
    }

    if (data && typeof data === 'object' && !Array.isArray(data) && data.data && Array.isArray(data.data)) {
      data = data.data;
    }

    if (!Array.isArray(data)) throw new Error('Dữ liệu không phải mảng');

    console.log(`Đã tải ${data.length} bản ghi từ máy chủ`);

    // Lưu vào cache để nạp tức thì trong các lần truy cập tiếp theo
    try {
      localStorage.setItem('gas_vitri_cache', JSON.stringify({ data: data, timestamp: Date.now() }));
    } catch (e) {
      console.warn('Không thể lưu cache vị trí:', e);
    }

    applyVitriData(data);

    if (vitriData.length === 0) {
      showToast('Không có điểm gas nào có tọa độ GPS', 'warning');
    } else {
      showToast(`Đã tải ${vitriData.length} vị trí có GPS`, 'success');
    }

  } catch (error) {
    console.error('Lỗi tải dữ liệu:', error);
    // Nếu chưa có dữ liệu hiển thị (kể cả từ cache) thì mới hiển thị empty-state lỗi
    if (!vitriData || vitriData.length === 0) {
      const emptyState = document.getElementById('empty-state');
      if (emptyState) {
        emptyState.style.display = 'block';
        emptyState.innerHTML = `
          <h3>
            <svg class="hero-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="color: var(--danger);">
              <path fill-rule="evenodd" d="M12 2.25c-5.385 0-9.75 4.365-9.75 9.75s4.365 9.75 9.75 9.75 9.75-4.365 9.75-9.75S17.385 2.25 12 2.25Zm-1.72 6.97a.75.75 0 1 0-1.06 1.06L10.94 12l-1.72 1.72a.75.75 0 1 0 1.06 1.06L12 13.06l1.72 1.72a.75.75 0 1 0 1.06-1.06L13.06 12l1.72-1.72a.75.75 0 1 0-1.06-1.06L12 10.94l-1.72-1.72Z" clip-rule="evenodd" />
            </svg>
            Lỗi khi tải dữ liệu
          </h3>
          <p>Không thể kết nối đến nguồn dữ liệu. Vui lòng thử lại sau.</p>
          <p style="font-size: 0.9rem; margin-top: 10px;">
            <em>Chi tiết lỗi: ${escapeHtml(error.message)}</em>
          </p>
          <button onclick="taiDuLieu()" style="
            margin-top: 15px;
            padding: 8px 16px;
            background: var(--primary);
            color: var(--text-inverse);
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
          ">
            ${ICONS.arrowPath} Thử lại
          </button>
        `;
      }
      showToast('Không thể tải dữ liệu từ Google Sheets!', 'error');
    } else {
      showToast('Không thể cập nhật dữ liệu mới nhất (đang dùng bản lưu offline)', 'warning');
    }
  } finally {
    const elapsed = Date.now() - startTime;
    const minDuration = 450; // Hiển thị mượt mà tối thiểu 450ms
    const delay = Math.max(0, minDuration - elapsed);
    setTimeout(() => {
      if (loader) loader.classList.add('hidden');
    }, delay);
  }
}

document.getElementById('search').addEventListener('input', filterVitri);
document.getElementById('search').addEventListener('keypress', e => { if (e.key === 'Enter') filterVitri(); });

document.addEventListener('click', e => {
  const badge = e.target.closest('.badge');
  if (badge) {
    const coords = badge.getAttribute('data-coords') || badge.textContent.trim();
    if (coords) copyToClipboard(coords);
  }
});

// Khôi phục vị trí trang và tránh lỗi giật/zoom của iOS Safari khi đóng bàn phím ảo
document.addEventListener('focusout', function(e) {
  if (e.target && ['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) {
    window.scrollTo({ top: window.scrollY, behavior: 'smooth' });
  }
});

document.addEventListener('DOMContentLoaded', () => {
  console.log('=== TRANG QUẢN LÝ VỊ TRÍ KHỞI ĐỘNG ===');
  loadCachedVitriData();
  taiDuLieu();
  const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
  if (!isTouchDevice) {
    setTimeout(() => document.getElementById('search')?.focus(), 500);
  }
});

window.addEventListener('online', () => {
  console.log('Kết nối mạng được khôi phục, tải lại dữ liệu...');
  taiDuLieu();
});

function vibrateShort() {
  if (navigator.vibrate) {
    try { navigator.vibrate(10); } catch(e) {}
  }
}

function openSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebar-overlay');
  if (!sidebar || !overlay) return;
  if (window.sidebarSwipeCancelAnim) window.sidebarSwipeCancelAnim();
  sidebar.style.left = '';
  sidebar.style.transition = '';
  overlay.style.opacity = '';
  overlay.style.transition = '';
  overlay.style.display = '';
  if (!sidebar.classList.contains('open')) {
    vibrateShort();
    sidebar.classList.add('open');
    overlay.classList.add('active');
    document.body.classList.add('no-scroll');
  }
}

function closeSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebar-overlay');
  if (!sidebar || !overlay) return;
  if (window.sidebarSwipeCancelAnim) window.sidebarSwipeCancelAnim();
  sidebar.style.left = '';
  sidebar.style.transition = '';
  overlay.style.opacity = '';
  overlay.style.transition = '';
  overlay.style.display = '';
  sidebar.classList.remove('open');
  overlay.classList.remove('active');
  if (!document.querySelector('.modal[style*="display: flex"]')) {
    document.body.classList.remove('no-scroll');
  }
}

function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  if (sidebar && sidebar.classList.contains('open')) {
    vibrateShort();
    closeSidebar();
  } else {
    openSidebar();
  }
}

function updateThemeToggle() {
  const themeIcon = document.getElementById('theme-icon');
  const themeText = document.getElementById('theme-text');
  if (!themeIcon || !themeText) return;

  const savedTheme = localStorage.getItem('gas_theme');
  const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const isDark = savedTheme === 'dark' || (savedTheme !== 'light' && systemPrefersDark);

  const btn = document.getElementById('theme-toggle');

  if (!savedTheme) {
    themeIcon.innerHTML = NAV_ICONS.cog;
    themeText.textContent = 'Tự động (' + (isDark ? 'tối' : 'sáng') + ')';
    if (btn) btn.setAttribute('aria-label', 'Đang dùng chế độ theo thiết bị');
  } else if (isDark) {
    themeIcon.innerHTML = NAV_ICONS.sun;
    themeText.textContent = 'Chế độ sáng';
    if (btn) btn.setAttribute('aria-label', 'Chuyển sang chế độ sáng');
  } else {
    themeIcon.innerHTML = NAV_ICONS.moon;
    themeText.textContent = 'Chế độ tối';
    if (btn) btn.setAttribute('aria-label', 'Chuyển sang chế độ tối');
  }
}

function applySavedTheme() {
  const savedTheme = localStorage.getItem('gas_theme');
  if (savedTheme === 'light' || savedTheme === 'dark') {
    document.documentElement.setAttribute('data-theme', savedTheme);
  } else {
    document.documentElement.removeAttribute('data-theme');
  }
  updateThemeToggle();
}

function toggleTheme() {
  vibrateShort();
  const savedTheme = localStorage.getItem('gas_theme');
  const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

  let nextTheme;
  if (!savedTheme) nextTheme = 'light';
  else if (savedTheme === 'light') nextTheme = 'dark';
  else nextTheme = null;

  if (nextTheme) {
    localStorage.setItem('gas_theme', nextTheme);
    document.documentElement.setAttribute('data-theme', nextTheme);
    if (typeof showToast === 'function') {
      showToast(nextTheme === 'dark' ? 'Đã chuyển sang chế độ tối' : 'Đã chuyển sang chế độ sáng', 'success');
    }
  } else {
    localStorage.removeItem('gas_theme');
    document.documentElement.removeAttribute('data-theme');
    if (typeof showToast === 'function') {
      showToast('Đã bật chế độ tự động theo thiết bị (' + (systemPrefersDark ? 'tối' : 'sáng') + ')', 'info');
    }
  }
  updateThemeToggle();
}

function setupSidebarSwipe() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebar-overlay');
  if (!sidebar || !overlay) return;

  const EDGE_THRESHOLD = 35;
  let startX = 0;
  let startY = 0;
  let currentX = 0;
  let currentY = 0;
  let startTime = 0;
  let isSwiping = false;
  let isClosing = false;
  let isDetermined = false;
  let animTimeout = null;

  window.sidebarSwipeCancelAnim = function() {
    if (animTimeout) {
      clearTimeout(animTimeout);
      animTimeout = null;
    }
  };

  function getSidebarWidth() {
    return sidebar.offsetWidth || 310;
  }

  function handleTouchStart(e) {
    if (e.touches.length !== 1) return;
    const touch = e.touches[0];
    const target = touch.target;
    if (target && target.closest && target.closest('input, textarea, select')) return;

    startX = touch.clientX;
    startY = touch.clientY;
    currentX = startX;
    currentY = startY;
    startTime = Date.now();
    isDetermined = false;
    isSwiping = false;

    const isOpen = sidebar.classList.contains('open');
    if (isOpen) {
      isClosing = true;
    } else {
      if (startX <= EDGE_THRESHOLD) {
        isClosing = false;
      } else {
        return;
      }
    }

    if (animTimeout) {
      clearTimeout(animTimeout);
      animTimeout = null;
    }
  }

  function handleTouchMove(e) {
    if (e.touches.length !== 1) return;
    const touch = e.touches[0];
    currentX = touch.clientX;
    currentY = touch.clientY;
    const deltaX = currentX - startX;
    const deltaY = currentY - startY;

    if (!isDetermined) {
      const absX = Math.abs(deltaX);
      const absY = Math.abs(deltaY);
      if (absX < 8 && absY < 8) return;
      isDetermined = true;

      if (!isClosing) {
        if (deltaX > 0 && absX > absY * 1.2) {
          isSwiping = true;
        } else {
          isSwiping = false;
          return;
        }
      } else {
        if (deltaX < 0 && absX > absY * 1.2) {
          isSwiping = true;
        } else {
          isSwiping = false;
          return;
        }
      }
    }

    if (!isSwiping) return;
    if (e.cancelable) e.preventDefault();

    const sidebarW = getSidebarWidth();
    sidebar.classList.add('swiping');

    let currentPos;
    if (!isClosing) {
      currentPos = Math.min(0, -sidebarW + deltaX);
      const ratio = Math.max(0, Math.min(1, (sidebarW + currentPos) / sidebarW));
      overlay.style.display = 'block';
      overlay.style.opacity = (ratio * 1).toFixed(3);
    } else {
      currentPos = Math.min(0, deltaX);
      const ratio = Math.max(0, Math.min(1, (sidebarW + currentPos) / sidebarW));
      overlay.style.opacity = (ratio * 1).toFixed(3);
    }
    sidebar.style.left = currentPos + 'px';
  }

  function handleTouchEnd() {
    if (!isSwiping) return;
    isSwiping = false;

    const sidebarW = getSidebarWidth();
    const deltaX = currentX - startX;
    const duration = Date.now() - startTime;
    const velocity = deltaX / duration;

    sidebar.classList.remove('swiping');

    if (!isClosing) {
      if (deltaX > sidebarW * 0.35 || velocity > 0.4) {
        sidebar.style.transition = 'left 0.2s cubic-bezier(0.25, 1, 0.5, 1)';
        overlay.style.transition = 'opacity 0.2s ease';
        sidebar.style.left = '0px';
        overlay.style.opacity = '1';
        animTimeout = setTimeout(() => {
          sidebar.classList.add('open');
          overlay.classList.add('active');
          sidebar.style.left = '';
          sidebar.style.transition = '';
          overlay.style.opacity = '';
          overlay.style.transition = '';
          document.body.classList.add('no-scroll');
        }, 200);
      } else {
        sidebar.style.transition = 'left 0.2s cubic-bezier(0.25, 1, 0.5, 1)';
        overlay.style.transition = 'opacity 0.2s ease';
        sidebar.style.left = (-sidebarW) + 'px';
        overlay.style.opacity = '0';
        animTimeout = setTimeout(() => {
          sidebar.classList.remove('open');
          overlay.classList.remove('active');
          sidebar.style.left = '';
          sidebar.style.transition = '';
          overlay.style.opacity = '';
          overlay.style.transition = '';
          overlay.style.display = '';
        }, 200);
      }
    } else {
      if (deltaX < -sidebarW * 0.3 || velocity < -0.4) {
        sidebar.style.transition = 'left 0.2s cubic-bezier(0.25, 1, 0.5, 1)';
        overlay.style.transition = 'opacity 0.2s ease';
        sidebar.style.left = (-sidebarW) + 'px';
        overlay.style.opacity = '0';
        animTimeout = setTimeout(() => {
          sidebar.classList.remove('open');
          overlay.classList.remove('active');
          sidebar.style.left = '';
          sidebar.style.transition = '';
          overlay.style.opacity = '';
          overlay.style.transition = '';
          overlay.style.display = '';
          document.body.classList.remove('no-scroll');
        }, 200);
      } else {
        sidebar.style.transition = 'left 0.2s cubic-bezier(0.25, 1, 0.5, 1)';
        overlay.style.transition = 'opacity 0.2s ease';
        sidebar.style.left = '0px';
        overlay.style.opacity = '1';
        animTimeout = setTimeout(() => {
          sidebar.classList.add('open');
          overlay.classList.add('active');
          sidebar.style.left = '';
          sidebar.style.transition = '';
          overlay.style.opacity = '';
          overlay.style.transition = '';
        }, 200);
      }
    }
  }

  document.addEventListener('touchstart', handleTouchStart, { passive: true });
  document.addEventListener('touchmove', handleTouchMove, { passive: false });
  document.addEventListener('touchend', handleTouchEnd, { passive: true });
  document.addEventListener('touchcancel', handleTouchEnd, { passive: true });
}

document.addEventListener('DOMContentLoaded', () => {
  const menuBtn = document.getElementById('menu-toggle');
  if (menuBtn) {
    menuBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleSidebar();
    });
  }

  const closeBtn = document.getElementById('close-sidebar');
  if (closeBtn) {
    closeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      closeSidebar();
    });
  }

  const overlay = document.getElementById('sidebar-overlay');
  if (overlay) {
    overlay.addEventListener('click', () => {
      closeSidebar();
    });
  }

  applySavedTheme();
  setupSidebarSwipe();
});

</script>
