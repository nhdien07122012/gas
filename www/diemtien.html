<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Đếm tiền theo mệnh giá - Quản lý điểm gas</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">

<style>
  /* ========== CSS VARIABLES FOR LIGHT MODE ========== */
  :root {
    --vnpost-blue: #005ba6;
    --vnpost-blue-hover: #004680;
    --vnpost-blue-light: #e8f2fa;
    --vnpost-yellow: #f59e0b;
    --primary: #005ba6;
    --primary-dark: #004680;
    --primary-light: #e8f2fa;
    --secondary: #10b981;
    --secondary-dark: #059669;
    --danger: #ef4444;
    --danger-dark: #dc2626;
    --warning: #f59e0b;
    --warning-dark: #d97706;
    --info: #0284c7;
    --success: #10b981;

    --bg-primary: #ffffff;
    --bg-secondary: #f8fafc;
    --bg-tertiary: #f1f5f9;
    --bg-card: #ffffff;
    --bg-modal: #ffffff;
    --bg-input: #ffffff;
    --bg-hover: #f1f5f9;
    --bg-active: #e2e8f0;

    --text-primary: #0f172a;
    --text-secondary: #334155;
    --text-tertiary: #64748b;
    --text-inverse: #ffffff;
    --text-muted: #94a3b8;

    --border-color: #e2e8f0;
    --border-light: #f1f5f9;
    --border-dark: #cbd5e1;
    --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.06), 0 1px 2px -1px rgb(0 0 0 / 0.04);
    --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.08), 0 4px 6px -4px rgb(0 0 0 / 0.04);
    --shadow-dark: 0 2px 10px rgba(0,0,0,0.15);

    --radius-xl: 28px;
    --radius-lg: 20px;
    --radius-md: 16px;
    --radius-sm: 12px;
    --radius-xs: 8px;
    --radius-circle: 50%;

    --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    --transition-fast: all 0.15s ease;
    --transition-slow: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);

    --opacity-disabled: 0.6;
    --opacity-hover: 0.9;
    --opacity-active: 0.8;

    --font-family: 'Be Vietnam Pro', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-family-mono: 'Roboto Mono', 'Courier New', monospace;
  }

  /* ========== HEROICONS BASE ========== */
  .hero-icon {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    display: inline-block;
    vertical-align: middle;
    color: currentColor;
  }
  .hero-icon-sm { width: 16px; height: 16px; }
  .hero-icon-md { width: 22px; height: 22px; }
  .hero-icon-lg { width: 26px; height: 26px; }
  .hero-icon-xl { width: 32px; height: 32px; }
  .hero-icon-inline { margin-right: 6px; }

  /* ========== DARK MODE VARIABLES ========== */
  @media (prefers-color-scheme: dark) {
    :root {
      --vnpost-blue: #38bdf8;
      --vnpost-blue-hover: #0284c7;
      --vnpost-blue-light: rgba(56, 189, 248, 0.14);
      --vnpost-yellow: #fbbf24;
      --primary: #38bdf8;
      --primary-dark: #0284c7;
      --primary-light: rgba(56, 189, 248, 0.14);
      --secondary: #34d399;
      --secondary-dark: #10b981;
      --danger: #f87171;
      --danger-dark: #ef4444;
      --warning: #fbbf24;
      --warning-dark: #f59e0b;
      --info: #38bdf8;
      --success: #34d399;

      --bg-primary: #1e293b;
      --bg-secondary: #0f172a;
      --bg-tertiary: #1e293b;
      --bg-card: #1e293b;
      --bg-modal: #1e293b;
      --bg-input: #0f172a;
      --bg-hover: #334155;
      --bg-active: #475569;

      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-tertiary: #94a3b8;
      --text-inverse: #ffffff;
      --text-muted: #64748b;

      --border-color: #334155;
      --border-light: #1e293b;
      --border-dark: #475569;
      --shadow: 0 2px 10px rgba(0,0,0,0.45);
      --shadow-lg: 0 8px 25px rgba(0,0,0,0.55);
      --shadow-dark: 0 2px 10px rgba(0,0,0,0.6);
    }

    header {
      background: linear-gradient(135deg, #00457c 0%, #002d54 100%) !important;
      color: var(--text-inverse) !important;
    }
    header h1, header p { color: var(--text-inverse) !important; }
    .menu-back { color: var(--text-inverse) !important; }
    .result-header { background: linear-gradient(135deg, var(--bg-tertiary), var(--bg-secondary)) !important; }
  }

  /* ========== CSS RESET & BASE STYLES ========== */
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html {
    font-size: 16px;
    transition: background-color 0.5s ease;
    font-family: var(--font-family);
    scrollbar-width: thin;
    scrollbar-color: var(--border-dark) var(--bg-tertiary);
  }

  body {
    font-family: var(--font-family);
    background-color: var(--bg-secondary);
    color: var(--text-primary);
    line-height: 1.6;
    padding: calc(16px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) calc(16px + env(safe-area-inset-left, 0px));
    min-height: 100vh;
    transition: var(--transition-slow);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    font-weight: 400;
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
    background: var(--bg-card);
    border-radius: var(--radius-xl);
    box-shadow: var(--shadow-lg);
    overflow: hidden;
    transition: var(--transition);
    border: 1px solid var(--border-color);
  }

  /* Header */
  header {
    background: linear-gradient(135deg, var(--vnpost-blue, #005ba6) 0%, #00457c 100%);
    color: var(--text-inverse);
    padding: 20px;
    position: relative;
    border-radius: var(--radius-xl) var(--radius-xl) 0 0;
  }

  header h1 {
    font-size: 17px;
    margin-bottom: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-weight: 700;
    font-family: var(--font-family);
    letter-spacing: -0.015em;
    line-height: 1.25;
  }
  header h1 .hero-icon { width: 20px; height: 20px; }

  header p {
    opacity: 0.9;
    font-size: 12px;
    text-align: center;
    font-family: var(--font-family);
    font-weight: 400;
    line-height: 1.3;
  }

  .menu-back {
    position: absolute;
    left: 18px;
    top: 18px;
    width: 44px;
    height: 44px;
    background: rgba(255,255,255,0.18);
    border: 1px solid rgba(255,255,255,0.35);
    color: var(--text-inverse);
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-family);
    font-weight: 600;
    transition: var(--transition);
    z-index: 2;
    padding: 0;
  }
  .menu-back:hover {
    background: rgba(255,255,255,0.28);
    transform: scale(1.05);
  }
  .menu-back .hero-icon { width: 22px; height: 22px; }

  /* Kết quả trên cùng */
  .result-header {
    background: linear-gradient(135deg, var(--bg-tertiary), var(--bg-secondary));
    padding: 20px;
    border-bottom: 2px solid var(--border-color);
    display: none;
  }

  .total-display { text-align: center; margin-bottom: 15px; }

  .total-amount {
    font-size: 24px;
    font-weight: 800;
    color: var(--primary);
    margin: 6px 0;
    font-family: var(--font-family);
    cursor: pointer;
    user-select: none;
    transition: transform 0.15s ease, opacity 0.15s ease;
    display: inline-block;
  }
  .total-amount:hover { transform: scale(1.05); opacity: 0.9; }
  .total-amount:active { transform: scale(0.98); }

  .comparison-row {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
    margin: 12px 0;
  }
  .comparison-item { text-align: center; min-width: 140px; }
  .comparison-label {
    font-size: 11.5px;
    color: var(--text-secondary);
    margin-bottom: 3px;
    font-family: var(--font-family);
    font-weight: 500;
  }
  .comparison-value {
    font-size: 18px;
    font-weight: 700;
    font-family: var(--font-family);
  }
  .revenue-total { color: var(--secondary); }
  .difference { color: var(--warning); }
  .positive { color: var(--secondary); }
  .negative { color: var(--danger); }

  /* Form nhập liệu */
  .input-section { padding: 20px; }
  .form-group { margin-bottom: 15px; }

  label {
    display: block;
    margin-bottom: 6px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-primary);
    font-family: var(--font-family);
  }

  select {
    width: 100%;
    padding: 10px 12px;
    background: var(--bg-input);
    color: var(--text-primary);
    border: 1.5px solid var(--border-color);
    border-radius: var(--radius-md);
    font-size: 13px;
    transition: var(--transition);
    font-family: var(--font-family);
    font-weight: 500;
  }
  select:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(0, 91, 166, 0.18);
  }

  .denominations-table {
    width: 100%;
    border-collapse: collapse;
    margin: 20px 0;
    background: var(--bg-card);
    border-radius: var(--radius-lg);
    overflow: hidden;
    box-shadow: var(--shadow);
    border: 1px solid var(--border-color);
  }
  .denominations-table th {
    background: var(--bg-tertiary);
    padding: 16px 15px;
    text-align: left;
    font-weight: 600;
    color: var(--text-primary);
    border-bottom: 2px solid var(--border-color);
    font-family: var(--font-family);
  }
  .denominations-table td {
    padding: 14px 15px;
    border-bottom: 1px solid var(--border-color);
    color: var(--text-primary);
    font-family: var(--font-family);
    font-weight: 400;
  }
  .denominations-table tr:last-child td { border-bottom: none; }
  .denominations-table tr:hover { background-color: var(--bg-hover); }

  .denomination-info { display: flex; align-items: center; gap: 10px; }
  .denomination-icon {
    width: 40px;
    height: 40px;
    border-radius: var(--radius-circle);
    background: var(--primary);
    color: var(--text-inverse);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.9rem;
    font-family: var(--font-family);
  }
  .denomination-text { display: flex; flex-direction: column; }
  .denomination-value {
    font-weight: 700;
    color: var(--text-primary);
    font-family: var(--font-family);
  }
  .denomination-label {
    font-size: 0.85rem;
    color: var(--text-secondary);
    font-family: var(--font-family);
    font-weight: 400;
  }

  .input-cell { width: 120px; }
  .bill-input {
    width: 100%;
    padding: 8px 10px;
    background: var(--bg-input);
    color: var(--text-primary);
    border: 1.5px solid var(--border-color);
    border-radius: var(--radius-md);
    font-size: 13.5px;
    text-align: center;
    transition: var(--transition);
    font-family: var(--font-family);
    font-weight: 600;
  }
  .bill-input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(0, 91, 166, 0.18);
    transform: translateY(-1px);
  }

  .quick-controls { display: flex; gap: 5px; margin-top: 5px; }
  .quick-btn {
    flex: 1;
    padding: 4px 6px;
    border: 1px solid var(--border-color);
    background: var(--bg-input);
    color: var(--text-primary);
    border-radius: var(--radius-xs);
    cursor: pointer;
    font-size: 12px;
    transition: var(--transition-fast);
    font-family: var(--font-family);
    font-weight: 500;
  }
  .quick-btn:hover {
    background: var(--primary);
    color: var(--text-inverse);
    border-color: var(--primary-dark);
  }

  /* Nút hành động */
  .action-buttons {
    display: flex;
    gap: 10px;
    margin-top: 20px;
    flex-wrap: wrap;
  }
  .action-btn {
    flex: 1;
    min-width: 140px;
    padding: 12px 18px;
    border: none;
    border-radius: var(--radius-md);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-family: var(--font-family);
    min-height: 46px;
  }
  .action-btn .hero-icon {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
  }
  .btn-primary {
    background-color: var(--primary);
    color: var(--text-inverse);
    border: 1px solid var(--primary-dark);
  }
  .btn-primary:hover {
    background-color: var(--primary-dark);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(0, 91, 166, 0.25);
  }
  .btn-secondary {
    background-color: var(--bg-tertiary);
    color: var(--text-primary);
    border: 1px solid var(--border-color);
  }
  .btn-secondary:hover {
    background-color: var(--bg-hover);
    transform: translateY(-2px);
    border-color: var(--border-dark);
  }
  .btn-success {
    background-color: var(--secondary);
    color: var(--text-inverse);
    border: 1px solid var(--secondary-dark);
  }
  .btn-success:hover { background-color: var(--secondary-dark); transform: translateY(-2px); }
  .btn-warning {
    background-color: var(--warning);
    color: var(--text-inverse);
    border: 1px solid var(--warning-dark);
  }
  .btn-warning:hover { background-color: var(--warning-dark); transform: translateY(-2px); }

  /* Toast */
  .toast {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) translateY(100px);
    background: var(--primary);
    color: var(--text-inverse);
    padding: 16px 24px;
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-lg);
    z-index: 1000;
    opacity: 0;
    transition: var(--transition);
    min-width: 280px;
    text-align: center;
    border: 1px solid var(--primary-dark);
    font-family: var(--font-family);
    font-weight: 500;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .toast.show { transform: translate(-50%, -50%) translateY(0); opacity: 1; }
  .toast.success { background: var(--secondary); border-color: var(--secondary-dark); }
  .toast.error { background: var(--danger); border-color: var(--danger-dark); }
  .toast.info { background: var(--info); border-color: var(--primary); }
  .toast.warning { background: var(--warning); border-color: var(--warning-dark); }
  .toast-icon { display: inline-flex; align-items: center; justify-content: center; }
  .toast-icon .hero-icon { width: 20px; height: 20px; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg-tertiary); border-radius: var(--radius-sm); }
  ::-webkit-scrollbar-thumb {
    background: var(--border-dark);
    border-radius: var(--radius-sm);
    border: 2px solid var(--bg-tertiary);
  }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }

  @keyframes pulseBorder {
    0% { box-shadow: 0 0 0 0 rgba(0, 91, 166, 0.7); }
    70% { box-shadow: 0 0 0 6px rgba(0, 91, 166, 0); }
    100% { box-shadow: 0 0 0 0 rgba(0, 91, 166, 0); }
  }
  .bill-input.navigation-highlight { animation: pulseBorder 1s ease; }

  /* Keyboard shortcuts hint */
  .keyboard-hint {
    font-size: 0.8rem;
    color: var(--text-secondary);
    margin-top: 5px;
    text-align: center;
    font-family: var(--font-family);
    display: none;
    align-items: center;
    gap: 6px;
  }
  .keyboard-hint kbd {
    display: inline-block;
    padding: 1px 6px;
    background: var(--bg-tertiary);
    border: 1px solid var(--border-dark);
    border-radius: 4px;
    font-family: var(--font-family-mono);
    font-size: 0.75rem;
  }
  .keyboard-hint .hero-icon { color: var(--warning); }
  @media (min-width: 768px) { .keyboard-hint { display: inline-flex; } }

  @media (max-width: 768px) {
    body { padding: calc(8px + env(safe-area-inset-top, 0px)) calc(8px + env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) calc(8px + env(safe-area-inset-left, 0px)); }
    header { padding: 18px; border-radius: var(--radius-lg) var(--radius-lg) 0 0; }
    header h1 { font-size: 1.4rem; }
    .total-amount { font-size: 1.8rem; }
    .comparison-row { gap: 15px; }
    .comparison-item { min-width: 120px; }
    .comparison-value { font-size: 1.3rem; }
    .denominations-table { font-size: 0.9rem; }
    .denominations-table th, .denominations-table td { padding: 12px 10px; }
    .denomination-icon { width: 35px; height: 35px; font-size: 0.8rem; }
    .action-buttons { flex-direction: column; gap: 12px; }
    .action-btn {
      min-width: 100%;
      padding: 14px 18px;
      min-height: 50px;
      font-size: 16.5px;
      font-weight: 700;
      border-radius: var(--radius-md);
    }
    .action-btn .hero-icon {
      width: 22px;
      height: 22px;
    }
    .shift-selection-card {
      padding: 14px 16px;
    }
    .shift-selection-card label,
    label[for="select-shift"] {
      font-size: 16px;
      font-weight: 700;
    }
    #select-shift {
      font-size: 16px !important;
      font-weight: 600;
      padding: 12px 14px;
      min-height: 48px;
    }
    .input-section { padding: 18px; }
  }

  @media (max-width: 480px) {
    body { padding: calc(8px + env(safe-area-inset-top, 0px)) calc(8px + env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) calc(8px + env(safe-area-inset-left, 0px)); }
    header { padding: 15px; border-radius: var(--radius-md) var(--radius-md) 0 0; }
    header h1 { font-size: 1.2rem; }
    header h1 .hero-icon { width: 22px; height: 22px; }
    .denominations-table { display: block; overflow-x: auto; }
    .input-cell { width: 100px; }
    .bill-input { padding: 8px; font-size: 13px; }
    .comparison-row { flex-direction: column; gap: 12px; }
    .menu-back { padding: 6px 10px; font-size: 0.85rem; }
    .action-btn { font-size: 16px; min-height: 48px; }
    .shift-selection-card label, label[for="select-shift"] { font-size: 15.5px; }
    #select-shift { font-size: 16px !important; min-height: 48px; }
  }

  @media (prefers-color-scheme: dark) {
    .quick-btn { background: var(--bg-secondary); border-color: var(--border-dark); }
    .quick-btn:hover { background: var(--primary); }
    .bill-input::placeholder { color: var(--text-muted); }
    .container { box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); }
    ::-webkit-scrollbar-track { background: var(--bg-secondary); }
    ::-webkit-scrollbar-thumb { background: var(--text-muted); }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }
    .denominations-table tr:hover { background-color: var(--bg-tertiary); }
    .denominations-table { border-color: var(--border-dark); }
    option { background-color: var(--bg-modal); color: var(--text-primary); font-family: var(--font-family); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
    .toast { transition: opacity 0.1s; }
    button:hover, .menu-back:hover { transform: none !important; }
  }

  h1, h2, h3, h4, h5, h6 { font-weight: 600; font-family: var(--font-family); }
  strong, b { font-weight: 700; font-family: var(--font-family); }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .fade-in { animation: fadeIn 0.3s ease-out; }

  /* ========== STAT CARDS ========== */
  .stats-container { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 20px; }
  .stat-card {
    flex: 1;
    min-width: 150px;
    background: var(--bg-tertiary);
    border-radius: var(--radius-lg);
    padding: 16px 20px;
    text-align: center;
    box-shadow: var(--shadow);
    transition: var(--transition);
    border: 1px solid var(--border-color);
  }
  .stat-card:hover {
    transform: translateY(-5px);
    box-shadow: var(--shadow-lg);
    border-color: var(--primary);
  }
  .stat-value {
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--primary);
    font-family: var(--font-family);
    word-break: break-all;
  }
  .stat-label {
    font-size: 0.9rem;
    color: var(--text-secondary);
    margin-top: 5px;
    font-family: var(--font-family);
    font-weight: 400;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
  }
  .stat-label .hero-icon { width: 16px; height: 16px; }
  .total-card { cursor: pointer; }
  .total-card:active { transform: scale(0.98); }

        // Loại bỏ emoji ở đầu chuỗi thông báo (nếu còn sót)
        function stripLeadingEmoji(str) {
            if (!str) return '';
            return str.replace(/^[\u{1F000}-\u{1FAFF}\u{2190}-\u{27BF}\u{2B00}-\u{2BFF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{FE0F}\u{200D}\s]+/u, '').trim() || str.trim();
        }

        // Danh sách mệnh giá tiền Việt Nam
        const denominations = [
            { value: 500000, label: "500,000 VNĐ", short: "500K", color: "#ff6b6b" },
            { value: 200000, label: "200,000 VNĐ", short: "200K", color: "#4ecdc4" },
            { value: 100000, label: "100,000 VNĐ", short: "100K", color: "#45b7d1" },
            { value: 50000, label: "50,000 VNĐ", short: "50K", color: "#96ceb4" },
            { value: 20000, label: "20,000 VNĐ", short: "20K", color: "#feca57" },
            { value: 10000, label: "10,000 VNĐ", short: "10K", color: "#ff9ff3" },
            { value: 5000, label: "5,000 VNĐ", short: "5K", color: "#54a0ff" },
            { value: 2000, label: "2,000 VNĐ", short: "2K", color: "#5f27cd" },
            { value: 1000, label: "1,000 VNĐ", short: "1K", color: "#c8d6e5" }
        ];

        let selectedShiftRevenue = 0;
        let currentCalculations = [];
        let currentInputIndex = 0;
        let inputElements = [];

        function formatCurrency(amount) {
            return new Intl.NumberFormat('vi-VN', {
                style: 'currency',
                currency: 'VND'
            }).format(amount);
        }

        // ========== TOAST (với SVG icon) ==========
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toast-message');
            const toastIcon = document.getElementById('toast-icon');

            let iconKey = 'checkCircle';
            if (type === 'error') iconKey = 'xCircle';
            else if (type === 'warning') iconKey = 'warning';
            else if (type === 'info') iconKey = 'info';

            toastIcon.innerHTML = ICONS[iconKey];
            toastMessage.textContent = stripLeadingEmoji(message);
            toast.className = `toast ${type} show`;

            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        function validateNumberInput(input) {
            let value = input.value;
            value = value.replace(/[^\d]/g, '');
            if (value.length > 6) value = value.substring(0, 6);
            if (value.length > 1 && value.startsWith('0')) value = value.replace(/^0+/, '');
            input.value = value;
            return value;
        }

        function initializeEnterNavigation() {
            inputElements = Array.from(document.querySelectorAll('.bill-input'));
            if (inputElements.length === 0) return;

            inputElements.sort((a, b) => {
                const rectA = a.getBoundingClientRect();
                const rectB = b.getBoundingClientRect();
                return rectA.top - rectB.top || rectA.left - rectB.left;
            });

            inputElements.forEach((input, index) => {
                input.removeEventListener('keydown', handleEnterNavigation);
                input.addEventListener('keydown', handleEnterNavigation);
                input.dataset.inputIndex = index;

                input.addEventListener('focus', function() {
                    currentInputIndex = index;
                    highlightInput(input);
                });

                input.addEventListener('blur', function() {
                    setTimeout(() => {
                        if (document.activeElement !== input) {
                            input.style.boxShadow = '';
                            input.style.borderColor = '';
                        }
                    }, 100);
                });
            });
        }

        function handleEnterNavigation(event) {
            if (event.key === 'Enter' || event.keyCode === 13) {
                event.preventDefault();
                const currentIndex = parseInt(this.dataset.inputIndex) || currentInputIndex;
                let nextIndex = currentIndex + 1;
                if (nextIndex >= inputElements.length) nextIndex = 0;
                if (inputElements[nextIndex]) {
                    inputElements[nextIndex].focus();
                    setTimeout(() => { inputElements[nextIndex].select(); }, 10);
                    currentInputIndex = nextIndex;
                }
            }
        }

        function highlightInput(input) {
            inputElements.forEach(el => el.classList.remove('navigation-highlight'));
            input.classList.add('navigation-highlight');
        }

        function focusFirstInput() {
            if (inputElements.length > 0) {
                inputElements[0].focus();
                inputElements[0].select();
                currentInputIndex = 0;
                highlightInput(inputElements[0]);
            }
        }

        function focusByDenomination(denomValue) {
            const inputId = `denom-${denomValue}`;
            const input = document.getElementById(inputId);
            if (input) {
                input.focus();
                input.select();
                const index = inputElements.findIndex(el => el.id === inputId);
                if (index !== -1) currentInputIndex = index;
                highlightInput(input);
            }
        }

        function setupGlobalKeyboardShortcuts() {
            document.addEventListener('keydown', function(event) {
                const activeElement = document.activeElement;
                const isInputFocused = activeElement && activeElement.classList.contains('bill-input');

                if (isInputFocused) {
                    if (event.key === 'Escape') {
                        event.preventDefault();
                        focusFirstInput();
                        showToast('Đã chuyển về ô đầu tiên (ESC)', 'info');
                    }
                    return;
                }

                if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') {
                    event.preventDefault();
                    calculateTotal(true);
                    showToast('Đã tính toán (Ctrl+Enter)', 'success');
                }

                if (event.key === 'Escape') {
                    event.preventDefault();
                    focusFirstInput();
                    showToast('Đã chuyển về ô đầu tiên (ESC)', 'info');
                }

                if (event.key === 'F2') {
                    event.preventDefault();
                    resetForm();
                }
            });
        }

        function createDenominationTable() {
            const grid = document.getElementById('denominations-grid');
            grid.innerHTML = '';

            denominations.forEach((denom) => {
                const card = document.createElement('div');
                card.className = 'denom-card fade-in';
                card.innerHTML = `
                    <div class="denom-card-header">
                        <div class="denomination-icon" style="background-color: ${denom.color}">
                            ${denom.short}
                        </div>
                        <div class="denomination-text">
                            <div class="denomination-value" style="font-weight: 700; color: var(--text-primary); font-family: var(--font-family);">${denom.label}</div>
                            <div class="denomination-label" style="font-size: 0.85rem; color: var(--text-secondary); font-family: var(--font-family);">${formatCurrency(denom.value)}</div>
                        </div>
                    </div>
                    <div class="denom-card-body">
                        <button type="button" class="stepper-btn" onclick="quickAdd(${denom.value}, -1)">−</button>
                        <input
                            type="text"
                            class="bill-input"
                            id="denom-${denom.value}"
                            placeholder="0"
                            oninput="handleInputChange(${denom.value})"
                            onfocus="this.select(); focusByDenomination(${denom.value})"
                            title="Nhập số tờ. Enter để chuyển ô"
                            inputmode="numeric"
                            pattern="[0-9]*"
                        >
                        <button type="button" class="stepper-btn" onclick="quickAdd(${denom.value}, 1)">+</button>
                    </div>
                    <div class="denom-card-footer">
                        <button type="button" class="quick-btn" onclick="quickAdd(${denom.value}, 5)">+5</button>
                        <button type="button" class="quick-btn" onclick="quickAdd(${denom.value}, 10)">+10</button>
                    </div>
                `;
                grid.appendChild(card);
            });

            setTimeout(() => { initializeEnterNavigation(); }, 100);
        }

        function handleInputChange(denomValue) {
            const input = document.getElementById(`denom-${denomValue}`);
            const validatedValue = validateNumberInput(input);
            calculateSingleRow(denomValue, validatedValue);
        }

        function quickAdd(denomValue, amount) {
            const input = document.getElementById(`denom-${denomValue}`);
            let currentValue = parseInt(input.value) || 0;
            let newValue = currentValue + amount;
            if (newValue < 0) newValue = 0;
            input.value = newValue;
            calculateSingleRow(denomValue, newValue.toString());
            focusByDenomination(denomValue);
        }

        function calculateSingleRow(denomValue, inputValue = null) {
            const input = document.getElementById(`denom-${denomValue}`);
            let quantity = 0;
            if (inputValue !== null) {
                quantity = parseInt(inputValue) || 0;
            } else {
                quantity = parseInt(validateNumberInput(input)) || 0;
            }
            input.value = quantity;

            clearTimeout(window.calculateTotalTimeout);
            window.calculateTotalTimeout = setTimeout(() => {
                calculateTotal(false);
            }, 100);
        }

        function calculateTotal(scrollToResult = false) {
            let total = 0;
            currentCalculations = [];

            denominations.forEach(denom => {
                const input = document.getElementById(`denom-${denom.value}`);
                const quantity = parseInt(input.value) || 0;

                if (quantity > 0) {
                    const amount = quantity * denom.value;
                    total += amount;
                    currentCalculations.push({
                        denomination: denom.value,
                        label: denom.label,
                        quantity: quantity,
                        amount: amount
                    });
                }
            });

            displayResults(total);

            if (scrollToResult) {
                const resultHeader = document.getElementById('result-header');
                if (resultHeader) {
                    resultHeader.scrollIntoView({ behavior: 'smooth', block: 'start', inline: 'nearest' });
                }
            }
            return total;
        }

        function displayResults(total) {
            const resultHeader = document.getElementById('result-header');
            const totalAmount = document.getElementById('total-amount');
            const revenueTotal = document.getElementById('revenue-total');
            const differenceAmount = document.getElementById('difference-amount');
            const statusText = document.getElementById('status-text');

            totalAmount.textContent = formatCurrency(total);
            const difference = total - selectedShiftRevenue;
            revenueTotal.textContent = formatCurrency(selectedShiftRevenue);

            if (difference === 0) {
                statusText.textContent = "ĐẦY ĐỦ";
                statusText.className = "stat-value positive";
                differenceAmount.textContent = formatCurrency(difference);
                differenceAmount.className = "stat-value positive";
            } else if (difference > 0) {
                statusText.textContent = "DƯ";
                statusText.className = "stat-value positive";
                differenceAmount.textContent = "+" + formatCurrency(difference);
                differenceAmount.className = "stat-value positive";
            } else {
                statusText.textContent = "THIẾU";
                statusText.className = "stat-value negative";
                differenceAmount.textContent = "-" + formatCurrency(Math.abs(difference));
                differenceAmount.className = "stat-value negative";
            }

            resultHeader.style.display = 'flex';
        }

        function resetForm() {
            denominations.forEach(denom => {
                const input = document.getElementById(`denom-${denom.value}`);
                input.value = '';
            });
            document.getElementById('result-header').style.display = 'none';
            showToast('Đã xóa tất cả số liệu!', 'success');
            setTimeout(() => { focusFirstInput(); }, 300);
        }

        function saveCount() {
            const selectedShift = document.getElementById('select-shift').value;
            const total = calculateTotal(false);

            if (total === 0) {
                showToast('Chưa có số liệu để lưu!', 'error');
                return;
            }
            if (!selectedShift) {
                showToast('Vui lòng chọn ca trước khi lưu!', 'error');
                return;
            }

            const countData = {
                shift: selectedShift,
                timestamp: new Date().toISOString(),
                total: total,
                revenue: selectedShiftRevenue,
                difference: total - selectedShiftRevenue,
                details: currentCalculations
            };

            let savedCounts = JSON.parse(localStorage.getItem('money_counts') || '[]');
            savedCounts = savedCounts.filter(item => item.shift !== selectedShift);
            savedCounts.push(countData);

            localStorage.setItem('money_counts', JSON.stringify(savedCounts));
            showToast(`Đã lưu kết quả cho ca ${getShiftDisplayName(selectedShift)}`, 'success');
        }

        async function copyToClipboard() {
            const total = calculateTotal(false);
            if (total === 0) {
                showToast('Chưa có số liệu để sao chép!', 'error');
                return;
            }

            const selectedShift = document.getElementById('select-shift').value;
            const shiftName = selectedShift ? getShiftDisplayName(selectedShift) : 'Không xác định';
            const difference = total - selectedShiftRevenue;

            let text = `=== KẾT QUẢ ĐẾM TIỀN ===\n`;
            text += `Ca: ${shiftName}\n`;
            text += `Thời gian: ${new Date().toLocaleString('vi-VN')}\n\n`;

            text += `CHI TIẾT MỆNH GIÁ:\n`;
            currentCalculations.forEach(item => {
                text += `${item.label.padEnd(15)} × ${item.quantity.toString().padStart(3)} tờ = ${formatCurrency(item.amount)}\n`;
            });

            text += `\nTỔNG ĐẾM ĐƯỢC: ${formatCurrency(total)}\n`;
            text += `DOANH THU CA: ${formatCurrency(selectedShiftRevenue)}\n`;

            if (difference > 0) {
                text += `CHÊNH LỆCH: DƯ ${formatCurrency(difference)}\n`;
            } else if (difference < 0) {
                text += `CHÊNH LỆCH: THIẾU ${formatCurrency(Math.abs(difference))}\n`;
            } else {
                text += `CHÊNH LỆCH: ĐẦY ĐỦ\n`;
            }

            try {
                await navigator.clipboard.writeText(text);
                showToast('Đã sao chép kết quả vào clipboard!', 'success');
            } catch (err) {
                showToast('Lỗi khi sao chép!', 'error');
                console.error(err);
            }
        }

        async function copyTotalOnly() {
            const total = calculateTotal(false);
            if (total === 0) {
                showToast('Chưa có số liệu để sao chép!', 'error');
                return;
            }
            try {
                const formatted = formatCurrency(total);
                await navigator.clipboard.writeText(formatted);
                showToast(`Đã sao chép số tiền: ${formatted}!`, 'success');
            } catch (err) {
                showToast('Lỗi khi sao chép!', 'error');
                console.error(err);
            }
        }

        function getShiftDisplayName(shiftKey) {
            if (/^\d{4}-\d{2}-\d{2}/.test(shiftKey)) {
                const d = new Date(shiftKey);
                const day = String(d.getDate()).padStart(2, '0');
                const month = String(d.getMonth() + 1).padStart(2, '0');
                const year = d.getFullYear();
                return `Ca ${day}-${month}-${year}`;
            }
            return shiftKey;
        }

        async function loadShiftsAndRevenue() {
            const loader = document.getElementById('page-loader');
            if (loader) loader.classList.remove('hidden');

            try {
                const response = await fetch('https://script.google.com/macros/s/AKfycbyRnnoEd2BnD7u1pXHER17Cv95BN9Z77yUeO6oR7CFRtbUqd-SiVJqBv5ENYyARwX77fw/exec');
                const data = await response.json();

                const shiftMap = new Map();
                data.forEach(item => {
                    if (item.ca && item.so_tien) {
                        const amount = parseInt(item.so_tien) || 0;
                        if (shiftMap.has(item.ca)) {
                            shiftMap.set(item.ca, shiftMap.get(item.ca) + amount);
                        } else {
                            shiftMap.set(item.ca, amount);
                        }
                    }
                });

                const select = document.getElementById('select-shift');
                const shifts = Array.from(shiftMap.entries()).sort((a, b) => b[0].localeCompare(a[0]));

                shifts.forEach(([shiftKey, revenue]) => {
                    const option = document.createElement('option');
                    option.value = shiftKey;
                    option.textContent = `${getShiftDisplayName(shiftKey)} (${formatCurrency(revenue)})`;
                    option.dataset.revenue = revenue;
                    select.appendChild(option);
                });

                select.addEventListener('change', function() {
                    const selectedOption = this.options[this.selectedIndex];
                    selectedShiftRevenue = parseInt(selectedOption.dataset.revenue) || 0;
                    loadSavedCount();
                    if (currentCalculations.length > 0) {
                        calculateTotal(false);
                    }
                });

                if (shifts.length > 0) {
                    select.value = shifts[0][0];
                    selectedShiftRevenue = shifts[0][1];
                    setTimeout(() => { loadSavedCount(); }, 500);
                }

            } catch (error) {
                console.log('Không thể tải dữ liệu từ server:', error);
                createSampleShifts();
            } finally {
                if (loader) loader.classList.add('hidden');
            }
        }

        function createSampleShifts() {
            const select = document.getElementById('select-shift');
            const today = new Date();

            for (let i = 0; i < 5; i++) {
                const date = new Date(today);
                date.setDate(today.getDate() - i);

                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                const shiftKey = `${year}-${month}-${day}`;

                const sampleRevenue = Math.floor(Math.random() * 50000000) + 10000000;

                const option = document.createElement('option');
                option.value = shiftKey;
                option.textContent = `${getShiftDisplayName(shiftKey)} (${formatCurrency(sampleRevenue)})`;
                option.dataset.revenue = sampleRevenue;
                select.appendChild(option);
            }

            if (select.options.length > 1) {
                select.selectedIndex = 1;
                selectedShiftRevenue = parseInt(select.options[1].dataset.revenue) || 0;
            }
        }

        function loadSavedCount() {
            const selectedShift = document.getElementById('select-shift').value;
            if (!selectedShift) return;

            const savedCounts = JSON.parse(localStorage.getItem('money_counts') || '[]');
            const savedData = savedCounts.find(item => item.shift === selectedShift);

            if (savedData) {
                savedData.details.forEach(item => {
                    const input = document.getElementById(`denom-${item.denomination}`);
                    if (input) {
                        input.value = item.quantity;
                        calculateSingleRow(item.denomination, item.quantity.toString());
                    }
                });
                calculateTotal(false);
                showToast('Đã tải số liệu đã lưu!', 'success');
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            console.log('=== TRANG ĐẾM TIỀN ĐANG KHỞI ĐỘNG ===');
            createDenominationTable();
            loadShiftsAndRevenue();
            setupGlobalKeyboardShortcuts();

            setTimeout(() => { focusFirstInput(); }, 800);
        });

function vibrateShort() {
  if (navigator.vibrate) {
    try { navigator.vibrate(10); } catch(e) {}
  }
}

function openSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebar-overlay');
  if (!sidebar || !overlay) return;
  if (window.sidebarSwipeCancelAnim) window.sidebarSwipeCancelAnim();
  sidebar.style.left = '';
  sidebar.style.transition = '';
  overlay.style.opacity = '';
  overlay.style.transition = '';
  overlay.style.display = '';
  if (!sidebar.classList.contains('open')) {
    vibrateShort();
    sidebar.classList.add('open');
    overlay.classList.add('active');
    document.body.classList.add('no-scroll');
  }
}

function closeSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebar-overlay');
  if (!sidebar || !overlay) return;
  if (window.sidebarSwipeCancelAnim) window.sidebarSwipeCancelAnim();
  sidebar.style.left = '';
  sidebar.style.transition = '';
  overlay.style.opacity = '';
  overlay.style.transition = '';
  overlay.style.display = '';
  sidebar.classList.remove('open');
  overlay.classList.remove('active');
  if (!document.querySelector('.modal[style*="display: flex"]')) {
    document.body.classList.remove('no-scroll');
  }
}

function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  if (sidebar && sidebar.classList.contains('open')) {
    vibrateShort();
    closeSidebar();
  } else {
    openSidebar();
  }
}

function updateThemeToggle() {
  const themeIcon = document.getElementById('theme-icon');
  const themeText = document.getElementById('theme-text');
  if (!themeIcon || !themeText) return;

  const savedTheme = localStorage.getItem('gas_theme');
  const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const isDark = savedTheme === 'dark' || (savedTheme !== 'light' && systemPrefersDark);

  const btn = document.getElementById('theme-toggle');

  if (!savedTheme) {
    themeIcon.innerHTML = NAV_ICONS.cog;
    themeText.textContent = 'Tự động (' + (isDark ? 'tối' : 'sáng') + ')';
    if (btn) btn.setAttribute('aria-label', 'Đang dùng chế độ theo thiết bị');
  } else if (isDark) {
    themeIcon.innerHTML = NAV_ICONS.sun;
    themeText.textContent = 'Chế độ sáng';
    if (btn) btn.setAttribute('aria-label', 'Chuyển sang chế độ sáng');
  } else {
    themeIcon.innerHTML = NAV_ICONS.moon;
    themeText.textContent = 'Chế độ tối';
    if (btn) btn.setAttribute('aria-label', 'Chuyển sang chế độ tối');
  }
}

function applySavedTheme() {
  const savedTheme = localStorage.getItem('gas_theme');
  if (savedTheme === 'light' || savedTheme === 'dark') {
    document.documentElement.setAttribute('data-theme', savedTheme);
  } else {
    document.documentElement.removeAttribute('data-theme');
  }
  updateThemeToggle();
}

function toggleTheme() {
  vibrateShort();
  const savedTheme = localStorage.getItem('gas_theme');
  const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

  let nextTheme;
  if (!savedTheme) nextTheme = 'light';
  else if (savedTheme === 'light') nextTheme = 'dark';
  else nextTheme = null;

  if (nextTheme) {
    localStorage.setItem('gas_theme', nextTheme);
    document.documentElement.setAttribute('data-theme', nextTheme);
    if (typeof showToast === 'function') {
      showToast(nextTheme === 'dark' ? 'Đã chuyển sang chế độ tối' : 'Đã chuyển sang chế độ sáng', 'success');
    }
  } else {
    localStorage.removeItem('gas_theme');
    document.documentElement.removeAttribute('data-theme');
    if (typeof showToast === 'function') {
      showToast('Đã bật chế độ tự động theo thiết bị (' + (systemPrefersDark ? 'tối' : 'sáng') + ')', 'info');
    }
  }
  updateThemeToggle();
}

function setupSidebarSwipe() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebar-overlay');
  if (!sidebar || !overlay) return;

  const EDGE_THRESHOLD = 35;
  let startX = 0;
  let startY = 0;
  let currentX = 0;
  let currentY = 0;
  let startTime = 0;
  let isSwiping = false;
  let isClosing = false;
  let isDetermined = false;
  let animTimeout = null;

  window.sidebarSwipeCancelAnim = function() {
    if (animTimeout) {
      clearTimeout(animTimeout);
      animTimeout = null;
    }
  };

  function getSidebarWidth() {
    return sidebar.offsetWidth || 310;
  }

  function handleTouchStart(e) {
    if (e.touches.length !== 1) return;
    const touch = e.touches[0];
    const target = touch.target;
    if (target && target.closest && target.closest('input, textarea, select')) return;

    startX = touch.clientX;
    startY = touch.clientY;
    currentX = startX;
    currentY = startY;
    startTime = Date.now();
    isDetermined = false;
    isSwiping = false;

    const isOpen = sidebar.classList.contains('open');
    if (isOpen) {
      isClosing = true;
    } else {
      if (startX <= EDGE_THRESHOLD) {
        isClosing = false;
      } else {
        return;
      }
    }

    if (animTimeout) {
      clearTimeout(animTimeout);
      animTimeout = null;
    }
  }

  function handleTouchMove(e) {
    if (e.touches.length !== 1) return;
    const touch = e.touches[0];
    currentX = touch.clientX;
    currentY = touch.clientY;
    const deltaX = currentX - startX;
    const deltaY = currentY - startY;

    if (!isDetermined) {
      const absX = Math.abs(deltaX);
      const absY = Math.abs(deltaY);
      if (absX < 8 && absY < 8) return;
      isDetermined = true;

      if (!isClosing) {
        if (deltaX > 0 && absX > absY * 1.2) {
          isSwiping = true;
        } else {
          isSwiping = false;
          return;
        }
      } else {
        if (deltaX < 0 && absX > absY * 1.2) {
          isSwiping = true;
        } else {
          isSwiping = false;
          return;
        }
      }
    }

    if (!isSwiping) return;
    if (e.cancelable) e.preventDefault();

    const sidebarW = getSidebarWidth();
    sidebar.classList.add('swiping');

    let currentPos;
    if (!isClosing) {
      currentPos = Math.min(0, -sidebarW + deltaX);
      const ratio = Math.max(0, Math.min(1, (sidebarW + currentPos) / sidebarW));
      overlay.style.display = 'block';
      overlay.style.opacity = (ratio * 1).toFixed(3);
    } else {
      currentPos = Math.min(0, deltaX);
      const ratio = Math.max(0, Math.min(1, (sidebarW + currentPos) / sidebarW));
      overlay.style.opacity = (ratio * 1).toFixed(3);
    }
    sidebar.style.left = currentPos + 'px';
  }

  function handleTouchEnd() {
    if (!isSwiping) return;
    isSwiping = false;

    const sidebarW = getSidebarWidth();
    const deltaX = currentX - startX;
    const duration = Date.now() - startTime;
    const velocity = deltaX / duration;

    sidebar.classList.remove('swiping');

    if (!isClosing) {
      if (deltaX > sidebarW * 0.35 || velocity > 0.4) {
        sidebar.style.transition = 'left 0.2s cubic-bezier(0.25, 1, 0.5, 1)';
        overlay.style.transition = 'opacity 0.2s ease';
        sidebar.style.left = '0px';
        overlay.style.opacity = '1';
        animTimeout = setTimeout(() => {
          sidebar.classList.add('open');
          overlay.classList.add('active');
          sidebar.style.left = '';
          sidebar.style.transition = '';
          overlay.style.opacity = '';
          overlay.style.transition = '';
          document.body.classList.add('no-scroll');
        }, 200);
      } else {
        sidebar.style.transition = 'left 0.2s cubic-bezier(0.25, 1, 0.5, 1)';
        overlay.style.transition = 'opacity 0.2s ease';
        sidebar.style.left = (-sidebarW) + 'px';
        overlay.style.opacity = '0';
        animTimeout = setTimeout(() => {
          sidebar.classList.remove('open');
          overlay.classList.remove('active');
          sidebar.style.left = '';
          sidebar.style.transition = '';
          overlay.style.opacity = '';
          overlay.style.transition = '';
          overlay.style.display = '';
        }, 200);
      }
    } else {
      if (deltaX < -sidebarW * 0.3 || velocity < -0.4) {
        sidebar.style.transition = 'left 0.2s cubic-bezier(0.25, 1, 0.5, 1)';
        overlay.style.transition = 'opacity 0.2s ease';
        sidebar.style.left = (-sidebarW) + 'px';
        overlay.style.opacity = '0';
        animTimeout = setTimeout(() => {
          sidebar.classList.remove('open');
          overlay.classList.remove('active');
          sidebar.style.left = '';
          sidebar.style.transition = '';
          overlay.style.opacity = '';
          overlay.style.transition = '';
          overlay.style.display = '';
          document.body.classList.remove('no-scroll');
        }, 200);
      } else {
        sidebar.style.transition = 'left 0.2s cubic-bezier(0.25, 1, 0.5, 1)';
        overlay.style.transition = 'opacity 0.2s ease';
        sidebar.style.left = '0px';
        overlay.style.opacity = '1';
        animTimeout = setTimeout(() => {
          sidebar.classList.add('open');
          overlay.classList.add('active');
          sidebar.style.left = '';
          sidebar.style.transition = '';
          overlay.style.opacity = '';
          overlay.style.transition = '';
        }, 200);
      }
    }
  }

  document.addEventListener('touchstart', handleTouchStart, { passive: true });
  document.addEventListener('touchmove', handleTouchMove, { passive: false });
  document.addEventListener('touchend', handleTouchEnd, { passive: true });
  document.addEventListener('touchcancel', handleTouchEnd, { passive: true });
}

document.addEventListener('DOMContentLoaded', () => {
  const menuBtn = document.getElementById('menu-toggle');
  if (menuBtn) {
    menuBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleSidebar();
    });
  }

  const closeBtn = document.getElementById('close-sidebar');
  if (closeBtn) {
    closeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      closeSidebar();
    });
  }

  const overlay = document.getElementById('sidebar-overlay');
  if (overlay) {
    overlay.addEventListener('click', () => {
      closeSidebar();
    });
  }

  applySavedTheme();
  setupSidebarSwipe();
});

</script>
