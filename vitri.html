<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản lý vị trí điểm gas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">

<style>
  /* ========== VNPOST DESIGN SYSTEM ========== */
  :root {
    --vnpost-blue: #005ba6;
    --vnpost-blue-dark: #00457c;
    --vnpost-blue-light: rgba(0, 91, 166, 0.08);
    --vnpost-gold: #f59e0b;
    --vnpost-gold-dark: #d97706;
    --vnpost-gold-light: rgba(245, 158, 11, 0.12);

    --primary: var(--vnpost-blue);
    --primary-dark: var(--vnpost-blue-dark);
    --primary-light: var(--vnpost-blue-light);

    --color-success: #10b981;
    --color-success-light: rgba(16, 185, 129, 0.12);
    --color-warning: #f59e0b;
    --color-warning-light: rgba(245, 158, 11, 0.12);
    --color-danger: #ef4444;
    --color-danger-light: rgba(239, 68, 68, 0.12);

    --bg-page: #f8fafc;
    --bg-card: #ffffff;
    --bg-secondary: #f1f5f9;
    --bg-tertiary: #e2e8f0;
    --bg-input: #ffffff;
    --bg-hover: #f1f5f9;

    --border-card: #e2e8f0;
    --border-light: #f1f5f9;
    --border-dark: #cbd5e1;

    --text-main: #0f172a;
    --text-primary: #0f172a;
    --text-secondary: #475569;
    --text-muted: #64748b;
    --text-tertiary: #94a3b8;
    --text-inverse: #ffffff;

    --font-family: 'Be Vietnam Pro', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;

    --radius-xs: 6px;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-xl: 20px;

    --shadow-sm: 0 1px 2px 0 rgba(15, 23, 42, 0.05);
    --shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.07), 0 2px 4px -2px rgba(15, 23, 42, 0.05);
    --shadow-md: 0 10px 15px -3px rgba(15, 23, 42, 0.08);

    --transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  }

  html[data-theme="dark"] {
    color-scheme: dark;
    --bg-page: #0b0f19;
    --bg-card: #131b2e;
    --bg-secondary: #1a243b;
    --bg-tertiary: #22304d;
    --bg-input: #1a243b;
    --bg-hover: #22304d;

    --border-card: #1e293b;
    --border-light: #1a243b;
    --border-dark: #334155;

    --text-main: #f8fafc;
    --text-primary: #f8fafc;
    --text-secondary: #cbd5e1;
    --text-muted: #94a3b8;
    --text-tertiary: #64748b;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg-page: #0b0f19;
      --bg-card: #131b2e;
      --bg-secondary: #1a243b;
      --bg-tertiary: #22304d;
      --bg-input: #1a243b;
      --bg-hover: #22304d;

      --border-card: #1e293b;
      --border-light: #1a243b;
      --border-dark: #334155;

      --text-main: #f8fafc;
      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --text-tertiary: #64748b;
    }
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-family);
    background-color: var(--bg-page);
    color: var(--text-main);
    line-height: 1.5;
    padding: 16px;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }

  .container {
    max-width: 680px;
    margin: 0 auto;
    background: var(--bg-card);
    border-radius: var(--radius-xl);
    border: 1px solid var(--border-card);
    box-shadow: var(--shadow-md);
    overflow: hidden;
  }

  .hero-icon {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    display: inline-block;
    vertical-align: middle;
    color: currentColor;
  }
  .hero-icon-sm { width: 16px; height: 16px; }

  /* App Header (Centered Title) */
  .app-header {
    background: linear-gradient(135deg, var(--vnpost-blue) 0%, #00457c 100%);
    color: white;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    text-align: center;
  }

  .menu-back {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255, 255, 255, 0.15);
    border: 1px solid rgba(255, 255, 255, 0.25);
    color: white;
    width: 36px;
    height: 36px;
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: var(--transition);
    flex-shrink: 0;
    z-index: 2;
  }
  .menu-back:hover {
    background: rgba(255, 255, 255, 0.28);
    transform: translateY(-50%) translateX(-2px);
  }

  .header-brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    width: 100%;
    padding: 0 44px;
  }
  .header-logo-wrap {
    width: 34px;
    height: 34px;
    border-radius: var(--radius-md);
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4px;
    box-shadow: var(--shadow-sm);
    flex-shrink: 0;
  }
  .header-logo {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }
  .header-text {
    flex: 1;
    min-width: 0;
  }
  .header-title-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .header-title-row h1 {
    font-size: 17px;
    font-weight: 700;
    margin: 0;
    line-height: 1.25;
    letter-spacing: -0.015em;
  }
  .header-badge {
    background: var(--vnpost-gold);
    color: #78350f;
    font-size: 10.5px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 9999px;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }
  .header-subtitle {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.85);
    margin-top: 2px;
    line-height: 1.3;
  }

  /* Search Bar */
  .search-section {
    padding: 14px 18px;
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border-card);
  }
  .search-group {
    position: relative;
    display: flex;
    align-items: center;
  }
  .search-icon {
    position: absolute;
    left: 12px;
    color: var(--text-muted);
    pointer-events: none;
    display: flex;
    align-items: center;
  }
  .search-group input {
    width: 100%;
    padding: 10px 12px 10px 38px;
    background: var(--bg-card);
    border: 1px solid var(--border-card);
    border-radius: var(--radius-md);
    color: var(--text-main);
    font-size: 13.5px;
    font-family: inherit;
    outline: none;
    transition: var(--transition);
  }
  .search-group input:focus {
    border-color: var(--vnpost-blue);
    box-shadow: 0 0 0 3px var(--vnpost-blue-light);
  }

  /* Location Grid */
  .location-grid {
    padding: 18px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }

  .location-card {
    background: var(--bg-card);
    border: 1px solid var(--border-card);
    border-radius: var(--radius-md);
    padding: 14px;
    box-shadow: var(--shadow-sm);
    transition: var(--transition);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .location-card:hover {
    border-color: var(--vnpost-blue);
    box-shadow: var(--shadow);
  }

  .card-header {
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .card-icon {
    width: 36px;
    height: 36px;
    border-radius: var(--radius-sm);
    background: var(--vnpost-blue-light);
    color: var(--vnpost-blue);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .card-info {
    flex: 1;
    min-width: 0;
  }
  .card-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-main);
    line-height: 1.3;
  }
  .card-address {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 3px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .card-address span {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-details {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 10px;
    background: var(--bg-secondary);
    border-radius: var(--radius-sm);
    font-size: 11.5px;
  }
  .gps-label {
    color: var(--text-muted);
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .badge-gps {
    font-family: var(--font-mono);
    background: var(--bg-card);
    border: 1px solid var(--border-card);
    padding: 2px 8px;
    border-radius: 9999px;
    color: var(--vnpost-blue);
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: var(--transition-fast);
  }
  .badge-gps:hover {
    background: var(--vnpost-blue-light);
    border-color: var(--vnpost-blue);
  }

  .btn-maps {
    padding: 9px 12px;
    border-radius: var(--radius-sm);
    background: linear-gradient(135deg, var(--vnpost-blue) 0%, #0284c7 100%);
    color: white;
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: var(--transition);
    box-shadow: var(--shadow-sm);
  }
  .btn-maps:hover {
    transform: translateY(-1px);
    box-shadow: var(--shadow);
  }

  /* Empty State */
  #empty-state {
    padding: 40px 20px;
    text-align: center;
    color: var(--text-muted);
    display: none;
  }
  #empty-state h3 {
    font-size: 15px;
    font-weight: 700;
    color: var(--text-main);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  /* Page Loader */
  .page-loader-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(15, 23, 42, 0.35);
    backdrop-filter: blur(3px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 3000;
    opacity: 1;
    transition: opacity 0.2s;
  }
  .page-loader-overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .loader {
    width: 38px;
    height: 38px;
    border: 3.5px solid rgba(255, 255, 255, 0.25);
    border-top-color: var(--vnpost-gold);
    border-radius: 50%;
    animation: spin 0.75s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .back-button {
    display: none;
  }

  @media (max-width: 480px) {
    body { padding: 8px; }
    .container { border-radius: var(--radius-lg); }
    .location-grid { padding: 12px; }
  }
</style>
<script>
  (() => {
    const savedTheme = localStorage.getItem('gas_theme');
    if (savedTheme === 'dark' || savedTheme === 'light') {
      document.documentElement.setAttribute('data-theme', savedTheme);
    }
  })();
</script>

    <div class="loader"></div>
  </div>

  <div class="container">
    <header class="app-header">
      <button class="menu-back" onclick="window.location.href='index.html'" aria-label="Quay lại">

        </div>

      </h3>
      <p>Hãy sử dụng chức năng lưu vị trí GPS trên trang chính để bắt đầu.</p>
      <p style="font-size: 11.5px; margin-top: 6px; color: var(--text-muted);">
        <em>Lưu ý: Chỉ những điểm gas có tọa độ GPS mới hiển thị ở đây.</em>
      </p>
    </div>
  </div>

  <a href="index.html" class="back-button" title="Quay về trang chính" aria-label="Quay về trang chính"></a>

// Loại bỏ emoji ở đầu chuỗi thông báo (nếu còn sót)
function stripLeadingEmoji(str) {
  if (!str) return '';
  return str.replace(/^[\u{1F000}-\u{1FAFF}\u{2190}-\u{27BF}\u{2B00}-\u{2BFF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{FE0F}\u{200D}\s]+/u, '').trim() || str.trim();
}

const scriptURL = 'https://script.google.com/macros/s/AKfycbyRnnoEd2BnD7u1pXHER17Cv95BN9Z77yUeO6oR7CFRtbUqd-SiVJqBv5ENYyARwX77fw/exec';
let allData = [];
let vitriData = [];
let currentFilteredData = [];

function extractGPS(note) {
  const noteStr = note == null ? '' : String(note);
  if (!noteStr.trim()) return null;
  const match = noteStr.match(/\[GPS:\s*([\d.]+),\s*([\d.]+)\]/);
  if (match) {
    const lat = parseFloat(match[1]);
    const lng = parseFloat(match[2]);
    if (!isNaN(lat) && !isNaN(lng)) {
      return {
        lat: lat.toFixed(6),
        lng: lng.toFixed(6),
        rawLat: lat,
        rawLng: lng
      };
    }
  }
  return null;
}

function escapeHtml(text) {
  if (text == null) return '';
  const str = String(text);
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function displayVitri(data) {
  const gridContainer = document.getElementById('location-grid');
  const emptyState = document.getElementById('empty-state');

  if (!data || data.length === 0) {
    if (gridContainer) gridContainer.innerHTML = '';
    if (emptyState) emptyState.style.display = 'block';
    return;
  }

  if (gridContainer) gridContainer.innerHTML = '';
  let count = 0;

  data.forEach(row => {
    const gps = extractGPS(row.ghi_chu);
    if (!gps) return;

    count++;
    const card = document.createElement('div');
    card.className = 'location-card fade-in';

    const tenDiem = escapeHtml(row.ten_diem) || 'Chưa có tên';
    const diaChi = escapeHtml(row.dia_chi) || 'Chưa có địa chỉ';

    card.innerHTML = `
      <div>
        <div class="card-header">
          <div class="card-icon">${ICONS.buildingStorefront}</div>
          <div class="card-info">
            <div class="card-title">${tenDiem}</div>
            <div class="card-address">${ICONS.mapPin} <span>${diaChi}</span></div>
          </div>
        </div>
      </div>

      <div class="card-details">
        <span class="gps-label">${ICONS.globeAlt} Tọa độ GPS:</span>
        <div class="badge-gps badge" data-coords="${gps.lat}, ${gps.lng}" title="Nhấn để sao chép tọa độ">
          ${ICONS.clipboard} ${gps.lat}, ${gps.lng}
        </div>
      </div>

      <a class="btn-maps" href="https://maps.google.com/?q=${gps.rawLat},${gps.rawLng}" target="_blank" title="Mở Google Maps dẫn đường">
        ${ICONS.map} Mở Google Maps
      </a>
    `;

    if (gridContainer) gridContainer.appendChild(card);
  });

  if (count === 0) {
    if (emptyState) {
      emptyState.style.display = 'block';
      emptyState.innerHTML = `
        <h3>
          <svg class="hero-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M6.912 3a3 3 0 0 0-2.868 2.118l-2.411 7.838a3 3 0 0 0-.133.882V18a3 3 0 0 0 3 3h15a3 3 0 0 0 3-3v-4.162c0-.299-.045-.596-.133-.882l-2.412-7.838A3 3 0 0 0 17.088 3H6.912Zm13.823 9.75-2.213-7.191A1.5 1.5 0 0 0 17.088 4.5H6.912a1.5 1.5 0 0 0-1.434 1.059L3.265 12.75H6.11a3 3 0 0 1 2.684 1.658l.256.513a1.5 1.5 0 0 0 1.342.829h3.218a1.5 1.5 0 0 0 1.342-.83l.256-.512a3 3 0 0 1 2.684-1.658h2.844Z" clip-rule="evenodd" />
          </svg>
          Không tìm thấy vị trí
        </h3>
        <p>Không có điểm gas nào có tọa độ GPS trong dữ liệu hiện tại.</p>
        <p style="font-size: 0.9rem; margin-top: 10px;">
          <em>Lưu ý: Chỉ những điểm gas có tọa độ GPS mới hiển thị ở đây.</em>
        </p>
      `;
    }
  } else {
    if (emptyState) emptyState.style.display = 'none';
  }

  updateResultCount(count);
}

function updateResultCount(count) {
  const header = document.querySelector('h1');
  if (header) {
    // Lấy text node bên trong h1 (không lấy SVG)
    const textContent = Array.from(header.childNodes)
      .filter(node => node.nodeType === Node.TEXT_NODE)
      .map(node => node.textContent)
      .join('')
      .replace(/\(\d+\)$/, '')
      .trim();
    const suffix = count > 0 ? ` (${count})` : '';
    // Cập nhật text node cuối cùng
    const textNodes = Array.from(header.childNodes).filter(node => node.nodeType === Node.TEXT_NODE);
    if (textNodes.length > 0) {
      // Cập nhật node cuối cùng
      textNodes[textNodes.length - 1].textContent = `\n      ${textContent}${suffix}\n    `;
    } else {
      header.appendChild(document.createTextNode(` ${textContent}${suffix}`));
    }
  }
}

function filterVitri() {
  const query = document.getElementById('search').value.toLowerCase().trim();
  if (!query) {
    currentFilteredData = vitriData;
    displayVitri(vitriData);
    return;
  }

  const filtered = vitriData.filter(row => {
    const searchableText = `
      ${row.ten_diem || ''}
      ${row.dia_chi || ''}
      ${row.ghi_chu || ''}
    `.toLowerCase();
    return searchableText.includes(query);
  });

  currentFilteredData = filtered;
  displayVitri(filtered);
}

async function copyToClipboard(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      showToast(`Đã sao chép: ${text}`, 'success');
    } else {
      const textArea = document.createElement('textarea');
      textArea.value = text;
      textArea.style.position = 'fixed';
      textArea.style.opacity = '0';
      document.body.appendChild(textArea);
      textArea.select();
      const success = document.execCommand('copy');
      document.body.removeChild(textArea);
      if (success) {
        showToast(`Đã sao chép: ${text}`, 'success');
      } else {
        showToast('Không thể sao chép vào clipboard', 'error');
      }
    }
  } catch (err) {
    console.error('Lỗi sao chép:', err);
    showToast('Lỗi khi sao chép', 'error');
  }
}

function showToast(message, type = 'success') {
  let toast = document.getElementById('toast-notification');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'toast-notification';
    toast.style.cssText = `
      position: fixed;
      top: 20px;
      right: 20px;
      background: ${type === 'success' ? 'var(--secondary)' : (type === 'warning' ? 'var(--warning)' : 'var(--danger)')};
      color: var(--text-inverse);
      padding: 12px 20px;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      z-index: 1000;
      opacity: 0;
      transform: translateY(-20px);
      transition: opacity 0.3s, transform 0.3s;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid ${type === 'success' ? 'var(--secondary-dark)' : (type === 'warning' ? 'var(--warning-dark)' : 'var(--danger-dark)')};
      font-family: 'Segoe UI', 'Inter', 'SF Pro Text', -apple-system, BlinkMacSystemFont, sans-serif;
    `;
    document.body.appendChild(toast);
  }

  // Chọn icon
  let iconKey = 'checkCircle';
  if (type === 'error') iconKey = 'xCircle';
  else if (type === 'warning') iconKey = 'warning';

  toast.innerHTML = `${ICONS[iconKey]}<span></span>`;
  const span = toast.querySelector('span');
  if (span) span.textContent = stripLeadingEmoji(message);

  toast.style.opacity = '1';
  toast.style.transform = 'translateY(0)';

  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateY(-20px)';
    setTimeout(() => {
      if (toast.parentNode) document.body.removeChild(toast);
    }, 300);
  }, 3000);
}

async function taiDuLieu() {
  const loader = document.getElementById('page-loader');
  if (loader) loader.classList.remove('hidden');

  try {
    console.log('Đang tải dữ liệu...');
    const url = scriptURL + '?t=' + Date.now();
    const response = await fetch(url);

    if (!response.ok) throw new Error(`Lỗi HTTP ${response.status}`);

    const text = await response.text();
    let data;

    try {
      data = JSON.parse(text);
    } catch (parseError) {
      const fixedText = text.trim();
      if (fixedText.startsWith('[') && fixedText.endsWith(']')) {
        data = JSON.parse(fixedText);
      } else {
        throw new Error('Dữ liệu không phải JSON hợp lệ');
      }
    }

    if (data && typeof data === 'object' && !Array.isArray(data) && data.data && Array.isArray(data.data)) {
      data = data.data;
    }

    if (!Array.isArray(data)) throw new Error('Dữ liệu không phải mảng');

    allData = data;
    console.log(`Đã tải ${allData.length} bản ghi`);

    vitriData = allData.filter(row => extractGPS(row.ghi_chu) !== null);

    const uniqueMap = new Map();
    vitriData.forEach(row => {
      const gps = extractGPS(row.ghi_chu);
      if (gps) {
        const key = `${row.ten_diem || ''}_${gps.lat}_${gps.lng}`;
        if (!uniqueMap.has(key)) uniqueMap.set(key, row);
      }
    });
    vitriData = Array.from(uniqueMap.values());

    currentFilteredData = vitriData;
    displayVitri(vitriData);

    if (vitriData.length === 0) {
      showToast('Không có điểm gas nào có tọa độ GPS', 'warning');
    } else {
      showToast(`Đã tải ${vitriData.length} vị trí có GPS`, 'success');
    }

  } catch (error) {
    console.error('Lỗi tải dữ liệu:', error);
    const emptyState = document.getElementById('empty-state');
    emptyState.style.display = 'block';
    emptyState.innerHTML = `
      <h3>
        <svg class="hero-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="color: var(--danger);">
          <path fill-rule="evenodd" d="M12 2.25c-5.385 0-9.75 4.365-9.75 9.75s4.365 9.75 9.75 9.75 9.75-4.365 9.75-9.75S17.385 2.25 12 2.25Zm-1.72 6.97a.75.75 0 1 0-1.06 1.06L10.94 12l-1.72 1.72a.75.75 0 1 0 1.06 1.06L12 13.06l1.72 1.72a.75.75 0 1 0 1.06-1.06L13.06 12l1.72-1.72a.75.75 0 1 0-1.06-1.06L12 10.94l-1.72-1.72Z" clip-rule="evenodd" />
        </svg>
        Lỗi khi tải dữ liệu
      </h3>
      <p>Không thể kết nối đến nguồn dữ liệu. Vui lòng thử lại sau.</p>
      <p style="font-size: 0.9rem; margin-top: 10px;">
        <em>Chi tiết lỗi: ${escapeHtml(error.message)}</em>
      </p>
      <button onclick="taiDuLieu()" style="
        margin-top: 15px;
        padding: 8px 16px;
        background: var(--primary);
        color: var(--text-inverse);
        border: none;
        border-radius: var(--radius-sm);
        cursor: pointer;
        font-weight: 500;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-family: inherit;
      ">
        ${ICONS.arrowPath} Thử lại
      </button>
    `;
    showToast('Không thể tải dữ liệu từ Google Sheets!', 'error');
  } finally {
    if (loader) loader.classList.add('hidden');
  }
}

document.getElementById('search').addEventListener('input', filterVitri);
document.getElementById('search').addEventListener('keypress', e => { if (e.key === 'Enter') filterVitri(); });

document.addEventListener('click', e => {
  const badge = e.target.closest('.badge');
  if (badge) {
    const coords = badge.getAttribute('data-coords') || badge.textContent.trim();
    if (coords) copyToClipboard(coords);
  }
});

document.addEventListener('DOMContentLoaded', () => {
  console.log('=== TRANG QUẢN LÝ VỊ TRÍ KHỞI ĐỘNG ===');
  taiDuLieu();
  setTimeout(() => document.getElementById('search')?.focus(), 500);
});

window.addEventListener('online', () => {
  console.log('Kết nối mạng được khôi phục, tải lại dữ liệu...');
  taiDuLieu();
});
</script>
